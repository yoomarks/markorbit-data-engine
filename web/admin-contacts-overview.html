<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>联系人总览 · MarkOrbit</title><link rel="stylesheet" href="/admin/assets/admin.css"></head><body>
<div id="page-content">
  <section class="hero"><div class="hero-copy"><h2>Contacts 联系人数据总览</h2><p>按国家、代理/直客类型和联系方式覆盖查看已导入联系人数据。</p></div><div class="hero-badge"></div></section>
  <section class="kpi-grid">
    <div class="kpi"><div class="kpi-top"><span class="kpi-label">联系人主体</span><span class="kpi-icon">CO</span></div><div class="kpi-value" id="k-entities">—</div><div class="kpi-meta" id="k-countries">—</div></div>
    <div class="kpi"><div class="kpi-top"><span class="kpi-label">代理人 / 代理机构</span><span class="kpi-icon">AG</span></div><div class="kpi-value" id="k-agents">—</div><div class="kpi-meta" id="k-both">—</div></div>
    <div class="kpi"><div class="kpi-top"><span class="kpi-label">直客主体</span><span class="kpi-icon">DR</span></div><div class="kpi-value" id="k-direct">—</div><div class="kpi-meta" id="k-unknown">—</div></div>
    <div class="kpi"><div class="kpi-top"><span class="kpi-label">联系人</span><span class="kpi-icon">PE</span></div><div class="kpi-value" id="k-people">—</div><div class="kpi-meta">Person relations</div></div>
  </section>
  <section class="kpi-grid">
    <div class="kpi"><div class="kpi-top"><span class="kpi-label">电话</span><span class="kpi-icon">☎</span></div><div class="kpi-value" id="k-phone">—</div><div class="kpi-meta"><a class="text-blue" href="/admin/contacts/directory?channel=PHONE">查看有电话的联系人 →</a></div></div>
    <div class="kpi"><div class="kpi-top"><span class="kpi-label">邮箱</span><span class="kpi-icon">@</span></div><div class="kpi-value" id="k-email">—</div><div class="kpi-meta"><a class="text-blue" href="/admin/contacts/directory?channel=EMAIL">查看有邮箱的联系人 →</a></div></div>
    <div class="kpi"><div class="kpi-top"><span class="kpi-label">网站</span><span class="kpi-icon">W</span></div><div class="kpi-value" id="k-web">—</div><div class="kpi-meta"><a class="text-blue" href="/admin/contacts/directory?channel=WEBSITE">查看有网站的联系人 →</a></div></div>
    <div class="kpi"><div class="kpi-top"><span class="kpi-label">WhatsApp</span><span class="kpi-icon">WA</span></div><div class="kpi-value" id="k-wa">—</div><div class="kpi-meta"><a class="text-blue" href="/admin/contacts/directory?channel=WHATSAPP">查看 WhatsApp →</a></div></div>
  </section>
  <section class="card">
    <div class="card-head"><div><div class="card-title">各国联系人分布</div><div class="card-note">点击国家进入联系人库并自动带入国家筛选。</div></div><div class="toolbar"><a class="btn btn-soft" href="/admin/contacts/directory">联系人库</a><a class="btn btn-ghost" href="/admin/contacts/imports">导入任务</a></div></div>
    <div class="table-wrap" style="max-height:680px"><table class="data-table"><thead><tr><th>国家/地区</th><th>主体</th><th>代理</th><th>直客</th><th>混合</th><th>联系人</th><th>电话</th><th>邮箱</th><th>网站</th></tr></thead><tbody id="countries"></tbody></table></div>
  </section>
</div>
<script src="/admin/assets/admin.js"></script><script>
MOAdmin.shell({active:'contacts-overview',title:'联系人总览',subtitle:'Countries · agents · direct clients · channel coverage',crumb:'联系人 / 总览'});
async function load(){try{const d=await MOAdmin.api('/api/admin/contacts/directory/analytics'),t=d.totals||{};document.getElementById('k-entities').textContent=MOAdmin.num(t.entities);document.getElementById('k-countries').textContent=`${MOAdmin.num(t.countries)} 个国家/地区`;document.getElementById('k-agents').textContent=MOAdmin.num(t.agents);document.getElementById('k-both').textContent=`混合 ${MOAdmin.num(t.both)}`;document.getElementById('k-direct').textContent=MOAdmin.num(t.direct_clients);document.getElementById('k-unknown').textContent=`未分类 ${MOAdmin.num(t.unknown)}`;document.getElementById('k-people').textContent=MOAdmin.num(t.people);document.getElementById('k-phone').textContent=MOAdmin.num(t.phones);document.getElementById('k-email').textContent=MOAdmin.num(t.emails);document.getElementById('k-web').textContent=MOAdmin.num(t.websites);document.getElementById('k-wa').textContent=MOAdmin.num(t.whatsapps);document.getElementById('countries').innerHTML=(d.countries||[]).length?d.countries.map(x=>{const c=x.country_code||'__UNKNOWN__',label=x.country_code||'国家未识别';return `<tr><td><a class="country-link" href="/admin/contacts/directory?country=${encodeURIComponent(c)}">${MOAdmin.esc(label)}</a></td><td>${MOAdmin.num(x.entities)}</td><td>${MOAdmin.num(x.agents)}</td><td>${MOAdmin.num(x.direct_clients)}</td><td>${MOAdmin.num(x.both)}</td><td>${MOAdmin.num(x.people)}</td><td>${MOAdmin.num(x.phones)}</td><td>${MOAdmin.num(x.emails)}</td><td>${MOAdmin.num(x.websites)}</td></tr>`}).join(''):`<tr><td colspan="9">${MOAdmin.empty('尚无已导入联系人数据')}</td></tr>`}catch(e){MOAdmin.error('#countries',e)}}load();
</script></body></html>
