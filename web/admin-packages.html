<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>来源包 · MarkOrbit</title><link rel="stylesheet" href="/admin/assets/admin.css"></head><body>
<div id="page-content">
  <section class="card">
    <div class="card-head"><div><div class="card-title">来源包明细</div><div class="card-note">按数据域、状态与关键字筛选，点击“详情”查看内部文件、质量问题和执行记录。</div></div><div class="toolbar"><input id="q" class="field search" placeholder="文件名 / 类型 / 分区 / SHA"><select id="domain" class="field"><option value="">全部数据域</option><option value="CN">中国 CN</option><option value="US_APPLICATION">US Application</option><option value="US_ASSIGNMENT">Assignment</option><option value="US_TTAB">TTAB</option></select><select id="status" class="field"><option value="">全部状态</option><option>SUCCESS</option><option>REGISTERED</option><option>PROCESSING</option><option>FAILED</option><option>MISSING_FILE</option><option>INTERRUPTED</option></select><select id="page-size" class="field"><option>25</option><option selected>50</option><option>100</option></select><button id="apply" class="btn btn-primary">筛选</button></div></div>
    <div class="table-wrap"><table class="data-table"><thead><tr><th>数据域</th><th>文件</th><th>类型 / 分区</th><th>大小</th><th>状态</th><th>内部文件 / 行</th><th>处理时间</th><th></th></tr></thead><tbody id="rows"></tbody></table></div><div id="pager"></div>
  </section>
</div>
<script src="/admin/assets/admin.js"></script><script>
MOAdmin.shell({active:'packages',title:'来源包',subtitle:'Package inventory · server-side pagination'});
const P=MOAdmin.query();['q','domain','status'].forEach(id=>document.getElementById(id).value=P.get(id)||'');document.getElementById('page-size').value=P.get('page_size')||'50';
function apply(page=1){MOAdmin.setQuery({q:q.value,domain:domain.value,status:status.value,page,page_size:document.getElementById('page-size').value},{replace:true});load()}
apply.onclick=()=>apply(1);document.getElementById('apply').onclick=()=>apply(1);q.onkeydown=e=>{if(e.key==='Enter')apply(1)};document.getElementById('page-size').onchange=()=>apply(1);
async function detail(id){try{const d=await MOAdmin.api('/api/admin/packages/'+encodeURIComponent(id)),p=d.package||{},files=d.internal_files||[],issues=d.quality_issues||[],jobs=d.jobs||[];MOAdmin.openDrawer(`<div class="drawer-head"><div><div class="page-title">${MOAdmin.esc(p.file_name||'Package')}</div><div class="page-subtitle mono">${MOAdmin.esc(p.package_id||'')}</div></div><button class="drawer-close" onclick="MOAdmin.closeDrawer()">×</button></div><div class="drawer-body"><div class="detail-grid"><div class="detail-item"><span>数据域</span><b>${MOAdmin.esc(p.domain||p.jurisdiction)}</b></div><div class="detail-item"><span>状态</span><b>${MOAdmin.status(p.status)}</b></div><div class="detail-item"><span>Package Kind</span><b>${MOAdmin.esc(p.package_kind||'—')}</b></div><div class="detail-item"><span>分区</span><b>${MOAdmin.esc(p.partition_value||'—')}</b></div><div class="detail-item"><span>大小</span><b>${MOAdmin.bytes(p.file_size)}</b></div><div class="detail-item"><span>处理时间</span><b>${MOAdmin.time(p.processed_at)}</b></div></div><div class="section-gap card-title">内部文件 (${files.length})</div><div class="quick-list">${files.slice(0,30).map(x=>`<div class="quick-item"><div class="quick-left"><div class="quick-title">${MOAdmin.esc(x.internal_name)}</div><div class="quick-sub">${MOAdmin.esc(x.file_role||'')} · ${MOAdmin.num(x.logical_rows)} rows</div></div><span>${MOAdmin.bytes(x.file_size)}</span></div>`).join('')||'<div class="text-muted">无内部文件记录</div>'}</div><div class="section-gap card-title">质量问题 (${issues.length})</div>${issues.length?issues.slice(0,20).map(x=>`<div class="notice-box"><b>${MOAdmin.esc(x.severity)} · ${MOAdmin.esc(x.issue_type)}</b><br>${MOAdmin.num(x.occurrence_count)} occurrences</div>`).join(''):'<div class="ok-box">暂无质量问题</div>'}<div class="section-gap card-title">执行记录 (${jobs.length})</div><div class="quick-list">${jobs.slice(0,15).map(x=>`<div class="quick-item"><div class="quick-left"><div class="quick-title">${MOAdmin.esc(x.job_type)}</div><div class="quick-sub">${MOAdmin.time(x.started_at)}</div></div>${MOAdmin.status(x.status)}</div>`).join('')||'<div class="text-muted">无任务记录</div>'}</div></div>`)}catch(e){alert('详情加载失败：'+e.message)}}
async function load(){const p=MOAdmin.query(),url=new URL('/api/admin/v2/packages',location.origin);['q','domain','status'].forEach(k=>{if(p.get(k))url.searchParams.set(k,p.get(k))});url.searchParams.set('page',p.get('page')||'1');url.searchParams.set('page_size',p.get('page_size')||'50');try{const d=await MOAdmin.api(url);document.getElementById('rows').innerHTML=d.items.length?d.items.map(x=>`<tr><td><span class="badge blue">${MOAdmin.esc(x.domain)}</span></td><td><div class="cell-title">${MOAdmin.esc(x.file_name)}</div><div class="cell-sub mono">${MOAdmin.esc(String(x.sha256||'').slice(0,16))}…</div></td><td><div>${MOAdmin.esc(x.package_kind||'—')}</div><div class="cell-sub">${MOAdmin.esc(x.partition_dimension||'')} ${MOAdmin.esc(x.partition_value||'')}</div></td><td class="nowrap">${MOAdmin.bytes(x.file_size)}</td><td>${MOAdmin.status(x.status)}${x.error_message?`<div class="cell-sub text-danger truncate">${MOAdmin.esc(x.error_message)}</div>`:''}</td><td>${MOAdmin.num(x.internal_file_count)} files<br><span class="cell-sub">${MOAdmin.num(x.internal_logical_rows)} rows</span></td><td class="nowrap">${MOAdmin.time(x.processed_at)}</td><td><button class="btn btn-ghost" onclick="detail('${MOAdmin.esc(x.package_id)}')">详情</button></td></tr>`).join(''):`<tr><td colspan="8">${MOAdmin.empty('没有符合条件的来源包')}</td></tr>`;document.getElementById('pager').innerHTML=MOAdmin.pageButtons(d,pn=>apply(pn))}catch(e){MOAdmin.error('#rows',e)}}load();
</script></body></html>
