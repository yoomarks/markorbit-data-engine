<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数据域 · MarkOrbit</title><link rel="stylesheet" href="/admin/assets/admin.css"></head><body>
<div id="page-content">
  <section class="hero"><div class="hero-copy"><h2 id="hero-title">数据域</h2><p id="hero-sub">覆盖范围、来源包、事实表与最近处理状态。</p></div><div class="hero-badge"></div></section>
  <section class="kpi-grid">
    <div class="kpi"><div class="kpi-top"><span class="kpi-label">来源包</span><span class="kpi-icon">PK</span></div><div class="kpi-value" id="k-total">—</div><div class="kpi-meta" id="k-success">—</div></div>
    <div class="kpi"><div class="kpi-top"><span class="kpi-label">完成率</span><span class="kpi-icon">%</span></div><div class="kpi-value" id="k-progress">—</div><div class="kpi-meta" id="k-errors">—</div></div>
    <div class="kpi"><div class="kpi-top"><span class="kpi-label">事实表物理行</span><span class="kpi-icon">DB</span></div><div class="kpi-value" id="k-rows">—</div><div class="kpi-meta" id="k-tables">—</div></div>
    <div class="kpi"><div class="kpi-top"><span class="kpi-label">磁盘占用</span><span class="kpi-icon">GB</span></div><div class="kpi-value" id="k-bytes">—</div><div class="kpi-meta" id="k-period">—</div></div>
  </section>
  <section class="grid-2">
    <div class="card"><div class="card-head"><div><div class="card-title">最近来源包</div><div class="card-note">完整明细在来源包页面继续筛选与分页。</div></div><a id="all-packages" class="btn btn-soft" href="/admin/packages">全部来源包</a></div><div class="table-wrap"><table class="data-table"><thead><tr><th>文件</th><th>类型</th><th>状态</th><th>处理时间</th></tr></thead><tbody id="packages"></tbody></table></div></div>
    <div class="card"><div class="card-head"><div><div class="card-title">事实表</div><div class="card-note">ClickHouse active-part 物理行数。</div></div></div><div class="table-wrap" style="max-height:520px"><table class="data-table"><thead><tr><th>表</th><th>行数</th><th>磁盘</th></tr></thead><tbody id="facts"></tbody></table></div></div>
  </section>
</div>
<script src="/admin/assets/admin.js"></script><script>
const slug=location.pathname.split('/').pop();const MAP={cn:{domain:'CN',active:'domain-cn',title:'中国 CN',sub:'CN trademark corpus · M1.6'},'us-application':{domain:'US_APPLICATION',active:'domain-us-app',title:'美国 US Application',sub:'USPTO Application facts'},'us-assignment':{domain:'US_ASSIGNMENT',active:'domain-us-assignment',title:'美国 Assignment',sub:'USPTO recorded assignment / interest facts'},'us-ttab':{domain:'US_TTAB',active:'domain-us-ttab',title:'美国 TTAB',sub:'USPTO TTAB procedural facts'}};const cfg=MAP[slug]||MAP.cn;MOAdmin.shell({active:cfg.active,title:cfg.title,subtitle:cfg.sub,crumb:'数据引擎 / 数据域'});document.getElementById('hero-title').textContent=cfg.title;document.getElementById('hero-sub').textContent=cfg.sub;document.getElementById('all-packages').href='/admin/packages?domain='+cfg.domain;
async function load(){try{const [o,p]=await Promise.all([MOAdmin.api('/api/admin/overview'),MOAdmin.api('/api/admin/v2/packages?domain='+cfg.domain+'&page=1&page_size=10')]);const d=(o.packages?.domains||[]).find(x=>x.domain===cfg.domain)||{};const f=(o.facts?.domains||[]).find(x=>x.domain===cfg.domain)||{};document.getElementById('k-total').textContent=MOAdmin.num(d.total);document.getElementById('k-success').textContent=`SUCCESS ${MOAdmin.num(d.success)}`;document.getElementById('k-progress').textContent=`${Number(d.progress_pct||0).toFixed(1)}%`;document.getElementById('k-errors').textContent=`FAILED ${MOAdmin.num(d.failed)} · PROCESSING ${MOAdmin.num(d.processing)}`;document.getElementById('k-rows').textContent=MOAdmin.num(f.physical_rows);document.getElementById('k-tables').textContent=`${MOAdmin.num(f.table_count)} tables`;document.getElementById('k-bytes').textContent=MOAdmin.bytes(f.bytes_on_disk);document.getElementById('k-period').textContent=`${d.source_period_start||'—'} → ${d.source_period_end||'—'}`;document.getElementById('packages').innerHTML=p.items.length?p.items.map(x=>`<tr><td><div class="cell-title">${MOAdmin.esc(x.file_name)}</div><div class="cell-sub mono">${MOAdmin.esc(String(x.sha256||'').slice(0,12))}…</div></td><td>${MOAdmin.esc(x.package_kind||'—')}</td><td>${MOAdmin.status(x.status)}</td><td>${MOAdmin.time(x.processed_at)}</td></tr>`).join(''):`<tr><td colspan="4">${MOAdmin.empty('暂无来源包')}</td></tr>`;const tables=(o.facts?.tables||[]).filter(x=>x.domain===cfg.domain);document.getElementById('facts').innerHTML=tables.length?tables.map(x=>`<tr><td class="mono">${MOAdmin.esc(x.table_name)}</td><td>${MOAdmin.num(x.physical_rows)}</td><td>${MOAdmin.bytes(x.bytes_on_disk)}</td></tr>`).join(''):`<tr><td colspan="3">${MOAdmin.empty('暂无事实表')}</td></tr>`}catch(e){MOAdmin.error('#packages',e)}}load();
</script></body></html>
