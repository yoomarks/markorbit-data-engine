<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>案件查询 · MarkOrbit</title><link rel="stylesheet" href="/admin/assets/admin.css"></head><body>
<div id="page-content">
  <section class="grid-2">
    <div class="card"><div class="card-head"><div><div class="card-title">商标 / 案件查询</div><div class="card-note">查询 Data Engine 已落库的中国与美国 Application 源事实。</div></div></div><div class="card-pad"><div class="toolbar"><select id="domain" class="field"><option value="CN">中国 CN</option><option value="US">美国 Application</option></select><input id="case-no" class="field search" placeholder="中国申请号或 8 位 USPTO Serial No."><button id="search-btn" class="btn btn-primary">查询</button></div><div id="result" class="section-gap"></div></div></div>
    <div class="card"><div class="card-head"><div><div class="card-title">数据任务</div><div class="card-note">所有商标数据写入操作统一进入后台任务中心。</div></div></div><div class="card-pad"><div class="notice-box">执行下一包、恢复失败、US 跨域安全门和任务状态现在统一由 worker 后台队列处理。首次 CN clean replay 仍必须使用既有 PowerShell 安全流程。</div><a class="btn btn-primary" href="/admin/jobs">进入任务中心 →</a></div></div>
  </section>
</div>
<script src="/admin/assets/admin.js"></script><script>
MOAdmin.shell({active:'search',title:'商标 / 案件查询',subtitle:'Source facts lookup · read only',crumb:'查询'});
function kv(obj){const entries=Object.entries(obj||{}).filter(([,v])=>v!==null&&v!==''&&v!==undefined).slice(0,30);return `<div class="detail-grid">${entries.map(([k,v])=>`<div class="detail-item"><span>${MOAdmin.esc(k)}</span><b>${MOAdmin.esc(typeof v==='object'?JSON.stringify(v):v)}</b></div>`).join('')}</div>`}
async function search(){const d=document.getElementById('domain').value,no=document.getElementById('case-no').value.trim();if(!no)return;const target=document.getElementById('result');target.innerHTML='<div class="notice-box">查询中…</div>';try{const url=d==='CN'?'/api/cn/cases/'+encodeURIComponent(no):'/api/us/cases/'+encodeURIComponent(no),x=await MOAdmin.api(url);const sections=d==='CN'?[['案件',x.case],['类别 / Scope',x.scopes],['商品',x.goods_items],['当事人',x.parties],['事件',x.events],['关系',x.relations]]:[['案件',x.case],['权利人',x.owners],['分类',x.classifications],['Correspondent',x.correspondent],['事件',x.events],['Statements',x.statements],['Design Search',x.design_searches],['Prior Registrations',x.prior_registrations]];target.innerHTML=`<div class="ok-box">查询成功</div>${sections.map(([name,v],i)=>`<div class="section-gap"><div class="card-title">${MOAdmin.esc(name)} ${Array.isArray(v)?`(${v.length})`:''}</div>${i===0&&v&&!Array.isArray(v)?kv(v):`<pre class="mono" style="background:#f7faff;color:#34445d;border:1px solid #e0e8f4;border-radius:10px;padding:12px;max-height:360px;overflow:auto">${MOAdmin.esc(JSON.stringify(v||[],null,2))}</pre>`}</div>`).join('')}`}catch(e){MOAdmin.error(target,e,'查询失败')}}
document.getElementById('search-btn').onclick=search;document.getElementById('case-no').onkeydown=e=>{if(e.key==='Enter')search()};
</script></body></html>
