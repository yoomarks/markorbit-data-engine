<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>联系人库 · MarkOrbit</title><link rel="stylesheet" href="/admin/assets/admin.css"></head><body>
<div id="page-content">
  <section class="card">
    <div class="card-head"><div><div class="card-title">联系人库</div><div class="card-note">公司、代理机构、联系人、电话、邮箱、网站与商标角色证据统一查看。</div></div><div class="toolbar"><input id="q" class="field search" placeholder="公司 / 姓名 / 电话 / 邮箱 / 网站"><select id="country" class="field"><option value="">全部国家</option><option value="__UNKNOWN__">国家未识别</option></select><select id="segment" class="field"><option value="">全部类型</option><option value="AGENT">代理</option><option value="DIRECT">直客</option><option value="BOTH">混合</option><option value="UNKNOWN">未分类</option></select><select id="channel" class="field"><option value="">全部联系方式</option><option value="PHONE">有电话</option><option value="EMAIL">有邮箱</option><option value="WEBSITE">有网站</option><option value="WHATSAPP">有 WhatsApp</option></select><select id="page-size" class="field"><option>25</option><option selected>50</option><option>100</option></select><button id="filter-btn" class="btn btn-primary">筛选</button></div></div>
    <div class="table-wrap"><table class="data-table"><thead><tr><th>名称</th><th>类型</th><th>国家</th><th>联系人</th><th>电话</th><th>邮箱</th><th>网站</th><th>商标证据</th><th></th></tr></thead><tbody id="rows"></tbody></table></div><div id="pager"></div>
  </section>
</div>
<script src="/admin/assets/admin.js"></script><script>
MOAdmin.shell({active:'contacts-directory',title:'联系人库',subtitle:'Filterable contact directory · server-side pagination',crumb:'联系人 / 联系人库'});
const P=MOAdmin.query();['q','segment','channel'].forEach(id=>document.getElementById(id).value=P.get(id)||'');document.getElementById('page-size').value=P.get('page_size')||'50';
function applyFilters(page=1){MOAdmin.setQuery({q:document.getElementById('q').value,country:document.getElementById('country').value,segment:document.getElementById('segment').value,channel:document.getElementById('channel').value,page,page_size:document.getElementById('page-size').value},{replace:true});load()}
document.getElementById('filter-btn').onclick=()=>applyFilters(1);document.getElementById('q').onkeydown=e=>{if(e.key==='Enter')applyFilters(1)};document.getElementById('page-size').onchange=()=>applyFilters(1);
function detail(x){MOAdmin.openDrawer(`<div class="drawer-head"><div><div class="page-title">${MOAdmin.esc(x.entity_name)}</div><div class="page-subtitle">${MOAdmin.segment(x.segment)} · ${MOAdmin.esc(x.country_code||'国家未识别')}</div></div><button class="drawer-close" onclick="MOAdmin.closeDrawer()">×</button></div><div class="drawer-body"><div class="detail-grid"><div class="detail-item"><span>国家/地区</span><b>${MOAdmin.esc(x.country_code||'未识别')}</b></div><div class="detail-item"><span>城市</span><b>${MOAdmin.esc(x.city||'—')}</b></div><div class="detail-item"><span>实体类型</span><b>${MOAdmin.esc(x.entity_type||'—')}</b></div><div class="detail-item"><span>联系人数量</span><b>${MOAdmin.num(x.person_count)}</b></div><div class="detail-item"><span>申请人/权利人提及</span><b>${MOAdmin.num(x.applicant_mentions)}</b></div><div class="detail-item"><span>代理人提及</span><b>${MOAdmin.num(x.agent_mentions)}</b></div></div><div class="section-gap card-title">联系人</div><div class="quick-list">${(x.people||[]).map(v=>`<div class="quick-item"><span>${MOAdmin.esc(v)}</span></div>`).join('')||'<div class="text-muted">—</div>'}</div><div class="section-gap card-title">电话 / 手机</div>${MOAdmin.channels(x.phones,20)}<div class="section-gap card-title">邮箱</div>${MOAdmin.channels(x.emails,20)}<div class="section-gap card-title">网站</div>${MOAdmin.channels(x.websites,20)}<div class="section-gap card-title">WhatsApp</div>${MOAdmin.channels(x.whatsapps,20)}<div class="section-gap card-title">来源 Profile</div><div>${(x.source_profiles||[]).map(v=>`<span class="badge blue" style="margin:3px">${MOAdmin.esc(v)}</span>`).join('')||'<span class="text-muted">—</span>'}</div></div>`)}
async function loadCountries(){try{const d=await MOAdmin.api('/api/admin/contacts/directory/countries'),sel=document.getElementById('country'),current=MOAdmin.query().get('country')||'';(d.countries||[]).filter(x=>x.country_code).forEach(x=>{const o=document.createElement('option');o.value=x.country_code;o.textContent=`${x.country_code} · ${MOAdmin.num(x.entities)}`;sel.appendChild(o)});sel.value=current}catch{}}
async function load(){const p=MOAdmin.query(),page=Number(p.get('page')||1),pageSize=Number(p.get('page_size')||50),url=new URL('/api/admin/contacts/directory',location.origin);['q','country','segment','channel'].forEach(k=>{if(p.get(k))url.searchParams.set(k,p.get(k))});url.searchParams.set('limit',pageSize);url.searchParams.set('offset',(page-1)*pageSize);try{const d=await MOAdmin.api(url),rows=d.rows||[];window.__contactRows=rows;document.getElementById('rows').innerHTML=rows.length?rows.map((x,i)=>`<tr><td><div class="cell-title">${MOAdmin.esc(x.entity_name)}</div><div class="cell-sub">${MOAdmin.esc(x.city||'')}</div></td><td>${MOAdmin.segment(x.segment)}</td><td>${x.country_code?`<a class="country-link" href="/admin/contacts/directory?country=${encodeURIComponent(x.country_code)}">${MOAdmin.esc(x.country_code)}</a>`:'<span class="text-muted">未识别</span>'}</td><td>${MOAdmin.channels(x.people,2)}</td><td>${MOAdmin.channels(x.phones,2)}</td><td>${MOAdmin.channels(x.emails,2)}</td><td>${MOAdmin.channels(x.websites,2)}</td><td><span class="badge blue">Owner ${MOAdmin.num(x.applicant_mentions)}</span> <span class="badge cyan">Agent ${MOAdmin.num(x.agent_mentions)}</span></td><td><button class="btn btn-ghost" onclick="detail(window.__contactRows[${i}])">详情</button></td></tr>`).join(''):`<tr><td colspan="9">${MOAdmin.empty('没有符合条件的联系人')}</td></tr>`;const meta={page,page_size:pageSize,total:Number(d.total||0),pages:Math.ceil(Number(d.total||0)/pageSize)};document.getElementById('pager').innerHTML=MOAdmin.pageButtons(meta,pn=>applyFilters(pn))}catch(e){MOAdmin.error('#rows',e)}}load();loadCountries();
</script></body></html>
