<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MarkOrbit Data Engine Admin</title>
  <link rel="stylesheet" href="/admin/assets/admin.css">
</head>
<body>
<div id="page-content">
  <section class="hero">
    <div class="hero-copy"><h2>Data Engine 运行总览</h2><p>蓝白 Admin V1 · 只把关键状态留在首页，明细进入独立分页。</p></div>
    <div class="hero-badge" aria-hidden="true"></div>
  </section>

  <section class="kpi-grid">
    <div class="kpi"><div class="kpi-top"><span class="kpi-label">Raw 文件</span><span class="kpi-icon">RW</span></div><div class="kpi-value" id="k-raw">—</div><div class="kpi-meta" id="k-raw-meta">—</div></div>
    <div class="kpi"><div class="kpi-top"><span class="kpi-label">来源包</span><span class="kpi-icon">PK</span></div><div class="kpi-value" id="k-packages">—</div><div class="kpi-meta" id="k-packages-meta">—</div></div>
    <div class="kpi"><div class="kpi-top"><span class="kpi-label">运行中任务</span><span class="kpi-icon">JB</span></div><div class="kpi-value" id="k-running">—</div><div class="kpi-meta" id="k-running-meta">—</div></div>
    <div class="kpi"><div class="kpi-top"><span class="kpi-label">ClickHouse 事实行</span><span class="kpi-icon">CH</span></div><div class="kpi-value" id="k-facts">—</div><div class="kpi-meta" id="k-facts-meta">—</div></div>
  </section>

  <section id="domain-grid" class="domain-grid"></section>

  <section class="grid-2">
    <div class="card">
      <div class="card-head"><div><div class="card-title">最近任务</div><div class="card-note">失败与运行中优先显示；完整任务进展请进入任务中心。</div></div><a class="btn btn-soft" href="/admin/jobs">查看任务进展</a></div>
      <div id="recent-jobs" class="card-pad"></div>
    </div>
    <div class="card">
      <div class="card-head"><div><div class="card-title">快速入口</div><div class="card-note">每类数据独立分页，不再堆叠在首页。</div></div></div>
      <div class="card-pad quick-list">
        <a class="quick-item" href="/admin/raw"><div class="quick-left"><div class="quick-title">Raw 数据</div><div class="quick-sub">库存、区域、文件与更新时间</div></div><span class="quick-value">→</span></a>
        <a class="quick-item" href="/admin/packages"><div class="quick-left"><div class="quick-title">来源包明细</div><div class="quick-sub">按域、状态、文件筛选与分页</div></div><span class="quick-value">→</span></a>
        <a class="quick-item" href="/admin/contacts"><div class="quick-left"><div class="quick-title">Contacts 联系人</div><div class="quick-sub">各国代理人、直客与联系方式</div></div><span class="quick-value">→</span></a>
        <a class="quick-item" href="/admin/search"><div class="quick-left"><div class="quick-title">案件查询 / 操作</div><div class="quick-sub">中国与美国商标事实查询</div></div><span class="quick-value">→</span></a>
      </div>
    </div>
  </section>
</div>
<script src="/admin/assets/admin.js"></script>
<script>
MOAdmin.shell({active:'dashboard',title:'总览 Dashboard',subtitle:'CN / US Application / Assignment / TTAB / Contacts'});
const DOMAIN={CN:['中国 CN','/admin/domains/cn'],US_APPLICATION:['美国 US Application','/admin/domains/us-application'],US_ASSIGNMENT:['美国 Assignment','/admin/domains/us-assignment'],US_TTAB:['美国 TTAB','/admin/domains/us-ttab']};
async function load(){try{
  const d=await MOAdmin.api('/api/admin/overview');
  const domains=d.packages?.domains||[];
  const pkg=domains.reduce((a,x)=>{a.total+=Number(x.total||0);a.success+=Number(x.success||0);return a},{total:0,success:0});
  const facts=(d.facts?.domains||[]).reduce((a,x)=>{a.rows+=Number(x.physical_rows||0);a.bytes+=Number(x.bytes_on_disk||0);a.tables+=Number(x.table_count||0);return a},{rows:0,bytes:0,tables:0});
  document.getElementById('k-raw').textContent=MOAdmin.num(d.raw?.total_files);document.getElementById('k-raw-meta').textContent=MOAdmin.bytes(d.raw?.total_bytes);
  document.getElementById('k-packages').textContent=MOAdmin.num(pkg.total);document.getElementById('k-packages-meta').textContent=`SUCCESS ${MOAdmin.num(pkg.success)}`;
  document.getElementById('k-running').textContent=MOAdmin.num(d.jobs?.running);document.getElementById('k-running-meta').textContent=`最近失败 ${MOAdmin.num(d.jobs?.failed)}`;
  document.getElementById('k-facts').textContent=MOAdmin.num(facts.rows);document.getElementById('k-facts-meta').textContent=`${MOAdmin.num(facts.tables)} 张表 · ${MOAdmin.bytes(facts.bytes)}`;
  document.getElementById('domain-grid').innerHTML=domains.filter(x=>DOMAIN[x.domain]).map(x=>{const [label,url]=DOMAIN[x.domain];return `<a class="domain-card" href="${url}"><div class="domain-top"><span class="domain-name">${label}</span>${x.failed?'<span class="badge red">FAILED '+MOAdmin.num(x.failed)+'</span>':'<span class="badge blue">'+Number(x.progress_pct||0).toFixed(1)+'%</span>'}</div><div class="progress"><i style="width:${Math.max(0,Math.min(100,Number(x.progress_pct||0)))}%"></i></div><div class="domain-meta"><span>SUCCESS ${MOAdmin.num(x.success)}</span><span>${MOAdmin.num(x.total)} packages</span></div></a>`}).join('');
  const jobs=d.jobs?.recent||[];const prioritized=[...jobs].sort((a,b)=>{const w=x=>x.status==='FAILED'?0:x.status==='RUNNING'?1:2;return w(a)-w(b)}).slice(0,7);
  document.getElementById('recent-jobs').innerHTML=prioritized.length?prioritized.map(x=>`<div class="quick-item"><div class="quick-left"><div class="quick-title">${MOAdmin.esc(x.job_type)}</div><div class="quick-sub">${MOAdmin.esc(x.domain)} · ${MOAdmin.time(x.started_at)} · ${MOAdmin.duration(x.duration_seconds)}</div></div>${MOAdmin.status(x.status)}</div>`).join(''):MOAdmin.empty('暂无任务记录');
}catch(e){MOAdmin.error('#recent-jobs',e)}}
load();
</script>
</body></html>
