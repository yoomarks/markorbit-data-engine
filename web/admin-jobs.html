<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>任务中心 · MarkOrbit</title><link rel="stylesheet" href="/admin/assets/admin.css"></head><body>
<div id="page-content">
  <section class="card">
    <div class="card-head"><div><div class="card-title">任务中心</div><div class="card-note">所有数据域任务统一查看；失败、运行中、中断状态可快速筛选。</div></div><div class="toolbar"><input id="q" class="field search" placeholder="任务类型 / 触发方式 / 错误"><select id="domain" class="field"><option value="">全部数据域</option><option value="CN">中国 CN</option><option value="US_APPLICATION">US Application</option><option value="US_ASSIGNMENT">Assignment</option><option value="US_TTAB">TTAB</option><option value="SYSTEM">System</option></select><select id="status" class="field"><option value="">全部状态</option><option>RUNNING</option><option>SUCCESS</option><option>FAILED</option><option>INTERRUPTED</option></select><select id="page-size" class="field"><option>25</option><option selected>50</option><option>100</option></select><button id="filter-btn" class="btn btn-primary">筛选</button></div></div>
    <div class="table-wrap"><table class="data-table"><thead><tr><th>数据域</th><th>任务</th><th>触发方式</th><th>状态</th><th>开始</th><th>耗时</th><th>指标 / 错误</th></tr></thead><tbody id="rows"></tbody></table></div><div id="pager"></div>
  </section>
</div>
<script src="/admin/assets/admin.js"></script><script>
MOAdmin.shell({active:'jobs',title:'任务中心',subtitle:'Job history · 独立分页与异常筛选'});
const P=MOAdmin.query();['q','domain','status'].forEach(id=>document.getElementById(id).value=P.get(id)||'');document.getElementById('page-size').value=P.get('page_size')||'50';
function applyFilters(page=1){MOAdmin.setQuery({q:document.getElementById('q').value,domain:document.getElementById('domain').value,status:document.getElementById('status').value,page,page_size:document.getElementById('page-size').value},{replace:true});load()}
document.getElementById('filter-btn').onclick=()=>applyFilters(1);document.getElementById('q').onkeydown=e=>{if(e.key==='Enter')applyFilters(1)};document.getElementById('page-size').onchange=()=>applyFilters(1);
async function load(){const p=MOAdmin.query(),url=new URL('/api/admin/v2/jobs',location.origin);['q','domain','status'].forEach(k=>{if(p.get(k))url.searchParams.set(k,p.get(k))});url.searchParams.set('page',p.get('page')||'1');url.searchParams.set('page_size',p.get('page_size')||'50');try{const d=await MOAdmin.api(url);document.getElementById('rows').innerHTML=d.items.length?d.items.map(x=>`<tr><td><span class="badge blue">${MOAdmin.esc(x.domain)}</span></td><td><div class="cell-title">${MOAdmin.esc(x.job_type)}</div><div class="cell-sub mono">${MOAdmin.esc(String(x.run_id||'').slice(0,12))}…</div></td><td>${MOAdmin.esc(x.trigger_type||'—')}</td><td>${MOAdmin.status(x.status)}</td><td class="nowrap">${MOAdmin.time(x.started_at)}</td><td class="nowrap">${MOAdmin.duration(x.duration_seconds)}</td><td>${x.error_message?`<div class="text-danger truncate">${MOAdmin.esc(x.error_message)}</div>`:`<span class="mono text-muted">${MOAdmin.esc(JSON.stringify(x.metrics||{})).slice(0,180)}</span>`}</td></tr>`).join(''):`<tr><td colspan="7">${MOAdmin.empty('没有符合条件的任务')}</td></tr>`;document.getElementById('pager').innerHTML=MOAdmin.pageButtons(d,pn=>applyFilters(pn))}catch(e){MOAdmin.error('#rows',e)}}load();
</script></body></html>
