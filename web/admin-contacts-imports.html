<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>联系人导入任务 · MarkOrbit</title><link rel="stylesheet" href="/admin/assets/admin.css"></head><body>
<div id="page-content">
  <section class="kpi-grid">
    <div class="kpi"><div class="kpi-top"><span class="kpi-label">READY</span><span class="kpi-icon">RD</span></div><div class="kpi-value" id="k-ready">—</div><div class="kpi-meta">等待人工执行</div></div>
    <div class="kpi"><div class="kpi-top"><span class="kpi-label">PROCESSING</span><span class="kpi-icon">PR</span></div><div class="kpi-value" id="k-processing">—</div><div class="kpi-meta">后台顺序执行</div></div>
    <div class="kpi"><div class="kpi-top"><span class="kpi-label">SUCCESS</span><span class="kpi-icon">OK</span></div><div class="kpi-value" id="k-success">—</div><div class="kpi-meta">已移入 archive</div></div>
    <div class="kpi"><div class="kpi-top"><span class="kpi-label">异常</span><span class="kpi-icon">!</span></div><div class="kpi-value" id="k-errors">—</div><div class="kpi-meta">FAILED / INVALID / MISSING</div></div>
  </section>
  <section class="card">
    <div class="card-head"><div><div class="card-title">Contact Ingest 导入任务</div><div class="card-note">后台扫描只生成任务；实际写入仍必须显式执行。</div></div><div class="toolbar"><input id="q" class="field search" placeholder="文件名 / Profile / 错误"><select id="status" class="field"><option value="">全部状态</option><option>READY</option><option>PROCESSING</option><option>SUCCESS</option><option>FAILED</option><option>INVALID</option><option>MISSING_FILE</option></select><select id="page-size" class="field"><option>25</option><option selected>50</option><option>100</option></select><button id="filter-btn" class="btn btn-soft">筛选</button><button id="scan-btn" class="btn btn-ghost">扫描文件</button><button id="batch-btn" class="btn btn-primary">批量执行 READY</button></div></div>
    <div id="message"></div>
    <div class="table-wrap"><table class="data-table"><thead><tr><th>文件</th><th>识别类型</th><th>规模</th><th>状态</th><th>发现 / 完成</th><th></th></tr></thead><tbody id="rows"></tbody></table></div><div id="pager"></div>
  </section>
</div>
<script src="/admin/assets/admin.js"></script><script>
MOAdmin.shell({active:'contacts-imports',title:'导入任务',subtitle:'Contact Ingest · scan / review / explicit apply',crumb:'联系人 / 导入任务'});
const P=MOAdmin.query();['q','status'].forEach(id=>document.getElementById(id).value=P.get(id)||'');document.getElementById('page-size').value=P.get('page_size')||'50';let readyCount=0;
function planMetric(x,k){return Number((x.plan_summary||{})[k]||0)}
function applyFilters(page=1){MOAdmin.setQuery({q:document.getElementById('q').value,status:document.getElementById('status').value,page,page_size:document.getElementById('page-size').value},{replace:true});loadTasks()}
document.getElementById('filter-btn').onclick=()=>applyFilters(1);document.getElementById('q').onkeydown=e=>{if(e.key==='Enter')applyFilters(1)};document.getElementById('page-size').onchange=()=>applyFilters(1);
async function loadSummary(){try{const d=await MOAdmin.api('/api/admin/contacts/summary'),s=d.statuses||{};readyCount=Number(s.READY||0);document.getElementById('k-ready').textContent=MOAdmin.num(readyCount);document.getElementById('k-processing').textContent=MOAdmin.num(s.PROCESSING);document.getElementById('k-success').textContent=MOAdmin.num(s.SUCCESS);document.getElementById('k-errors').textContent=MOAdmin.num(Number(s.FAILED||0)+Number(s.INVALID||0)+Number(s.MISSING_FILE||0));document.getElementById('batch-btn').disabled=readyCount===0}catch(e){MOAdmin.error('#message',e)}}
async function detail(id){try{const x=await MOAdmin.api('/api/admin/contacts/tasks/'+encodeURIComponent(id)),p=x.plan_summary||{},tables=p.tables||[],runs=x.import_runs||[];MOAdmin.openDrawer(`<div class="drawer-head"><div><div class="page-title">${MOAdmin.esc(x.file_name)}</div><div class="page-subtitle">${MOAdmin.status(x.status)} · ${MOAdmin.esc(x.detected_profile||'UNKNOWN')}</div></div><button class="drawer-close" onclick="MOAdmin.closeDrawer()">×</button></div><div class="drawer-body"><div class="detail-grid"><div class="detail-item"><span>源数据行</span><b>${MOAdmin.num(p.source_rows)}</b></div><div class="detail-item"><span>主体</span><b>${MOAdmin.num(p.entities_planned)}</b></div><div class="detail-item"><span>联系人</span><b>${MOAdmin.num(p.people_planned)}</b></div><div class="detail-item"><span>联系方式</span><b>${MOAdmin.num(p.channels_planned)}</b></div></div>${x.error_message?`<div class="error-box section-gap">${MOAdmin.esc(x.error_message)}</div>`:''}<div class="section-gap card-title">识别表 / Sheet</div>${tables.map(t=>`<div class="detail-item" style="margin-top:7px"><span>${MOAdmin.esc(t.source_member||x.file_name)} · ${MOAdmin.esc(t.sheet_name||'')}</span><b>${MOAdmin.esc(t.profile||'UNKNOWN')} · ${MOAdmin.num(t.source_rows)} rows</b></div>`).join('')||'<div class="text-muted">—</div>'}<div class="section-gap card-title">执行记录</div>${runs.map(r=>`<div class="quick-item"><div class="quick-left"><div class="quick-title">${MOAdmin.time(r.started_at)}</div><div class="quick-sub">${MOAdmin.esc(JSON.stringify(r.metrics||{})).slice(0,180)}</div></div>${MOAdmin.status(r.status)}</div>`).join('')||'<div class="text-muted">尚未执行</div>'}</div>`)}catch(e){alert('详情加载失败：'+e.message)}}
async function runTask(id){if(!confirm('确认执行这一个联系人导入任务？成功后源文件会移入 archive/contacts。'))return;try{await MOAdmin.api('/api/admin/contacts/tasks/'+encodeURIComponent(id)+'/apply',{method:'POST'});await refresh()}catch(e){alert('导入失败：'+e.message);await refresh()}}
document.getElementById('scan-btn').onclick=async()=>{const b=document.getElementById('scan-btn');b.disabled=true;b.textContent='扫描中…';try{const d=await MOAdmin.api('/api/admin/contacts/scan',{method:'POST'});document.getElementById('message').innerHTML=`<div class="ok-box">扫描完成：${MOAdmin.num(d.files_seen)} 个文件，READY ${MOAdmin.num(d.ready)}，异常 ${MOAdmin.num(d.invalid)}。</div>`;await refresh()}catch(e){MOAdmin.error('#message',e)}finally{b.disabled=false;b.textContent='扫描文件'}};
document.getElementById('batch-btn').onclick=async()=>{if(!readyCount||!confirm(`确认批量执行 ${MOAdmin.num(readyCount)} 个 READY 任务？`))return;try{const d=await MOAdmin.api('/api/admin/contacts/tasks/batch-apply',{method:'POST'});document.getElementById('message').innerHTML=`<div class="ok-box">已提交 ${MOAdmin.num(d.accepted_count)} 个 READY 任务，后台顺序执行。</div>`;await refresh()}catch(e){MOAdmin.error('#message',e)}};
async function loadTasks(){const p=MOAdmin.query(),url=new URL('/api/admin/v2/contact-tasks',location.origin);['q','status'].forEach(k=>{if(p.get(k))url.searchParams.set(k,p.get(k))});url.searchParams.set('page',p.get('page')||'1');url.searchParams.set('page_size',p.get('page_size')||'50');try{const d=await MOAdmin.api(url);document.getElementById('rows').innerHTML=d.items.length?d.items.map(x=>{const can=x.status==='READY'||x.status==='FAILED';return `<tr><td><div class="cell-title">${MOAdmin.esc(x.file_name)}</div><div class="cell-sub mono">${MOAdmin.esc(String(x.source_sha256||'').slice(0,16))}… · ${MOAdmin.bytes(x.file_size)}</div></td><td><span class="badge blue">${MOAdmin.esc(x.detected_profile||'UNKNOWN')}</span><div class="cell-sub">${MOAdmin.esc(x.file_type||'')}</div></td><td>${MOAdmin.num(planMetric(x,'source_rows'))} rows<br><span class="cell-sub">${MOAdmin.num(planMetric(x,'entities_planned'))} 主体 · ${MOAdmin.num(planMetric(x,'channels_planned'))} 联系方式</span></td><td>${MOAdmin.status(x.status)}${x.error_message?`<div class="cell-sub text-danger truncate">${MOAdmin.esc(x.error_message)}</div>`:''}</td><td class="nowrap">${MOAdmin.time(x.discovered_at)}<br><span class="cell-sub">${x.finished_at?MOAdmin.time(x.finished_at):''}</span></td><td class="nowrap"><button class="btn btn-ghost" onclick="detail('${MOAdmin.esc(x.task_id)}')">详情</button>${can?` <button class="btn btn-soft" onclick="runTask('${MOAdmin.esc(x.task_id)}')">${x.status==='FAILED'?'重试':'执行'}</button>`:''}</td></tr>`}).join(''):`<tr><td colspan="6">${MOAdmin.empty('暂无导入任务')}</td></tr>`;document.getElementById('pager').innerHTML=MOAdmin.pageButtons(d,pn=>applyFilters(pn))}catch(e){MOAdmin.error('#rows',e)}}async function refresh(){await Promise.all([loadSummary(),loadTasks()])}refresh();setInterval(refresh,15000);
</script></body></html>
