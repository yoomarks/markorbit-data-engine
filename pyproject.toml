[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "markorbit-data-engine"
version = "0.4.0"
description = "MarkOrbit trademark data engine for CN M1.6 and US M1"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "pydantic-settings==2.10.1",
  "psycopg[binary]==3.2.9",
  "clickhouse-connect==0.8.18",
  "pdfplumber==0.11.10",
  "xlrd==2.0.2",
  "phonenumbers==9.0.37",
  "pycountry==26.2.16",
  "pillow==11.3.0"
]

[project.optional-dependencies]
dev = ["pytest==8.4.1", "ruff==0.12.7"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
"app/cn/ingest.py" = ["F401"]
"tests/test_m15_insert_contract.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
