name: Raw Cold Parity Runtime

on:
  pull_request:
    paths:
      - 'scripts/profile-raw-cold-parity.ps1'
      - 'tests/test_raw_cold_parity_contract.py'
      - '.github/workflows/raw-cold-parity-runtime.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows-powershell51:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse and freeze Raw Cold parity under Windows PowerShell 5.1
        shell: powershell
        run: |
          $scriptPath = Join-Path $PWD 'scripts\profile-raw-cold-parity.ps1'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($scriptPath, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw 'PowerShell parser errors detected.'
          }

          $text = Get-Content -LiteralPath $scriptPath -Raw -Encoding UTF8
          $required = @(
            'RAW_COLD_PARITY_V1',
            'RAW_COLD_PARITY_DONE',
            'RAW_COLD_PARITY_NO_REUSABLE_EQUIVALENT',
            'RAW_COLD_PARITY_EQUIVALENT',
            'DESIGN_FORWARD_COPY_TO_F_RAW_ROOT',
            'DESIGN_NO_COPY_ENV_CUTOVER',
            '[System.IO.Directory]::EnumerateFiles',
            '[System.Security.Cryptography.SHA256]::Create()',
            'migration_authorized=$false',
            'env_change_authorized=$false',
            'raw_copy_authorized=$false',
            'raw_move_authorized=$false',
            'raw_delete_authorized=$false',
            'us_package_2_authorized=$false',
            'us_bulk_authorized=$false'
          )
          foreach ($marker in $required) {
            if (-not $text.Contains($marker)) { throw "Missing safety marker: $marker" }
          }

          $forbidden = @(
            'Copy-Item',
            'Move-Item',
            'Remove-Item',
            'robocopy',
            'rsync',
            'Mount-VHD',
            'Dismount-VHD',
            'Resize-VHD',
            'New-VHD',
            'Format-Volume',
            'mkfs.ext4',
            '--unregister',
            '2023_5.zip',
            '-Apply -All'
          )
          foreach ($marker in $forbidden) {
            if ($text.Contains($marker)) { throw "Forbidden mutation/replay marker present: $marker" }
          }

          Write-Host 'RAW_COLD_PARITY_PS51_CONTRACT_PASS'
