name: Dedicated WSL ClickHouse Startup Probe V3 Runtime

on:
  pull_request:
    paths:
      - 'scripts/probe-dedicated-wsl-clickhouse-startup-v3.ps1'
      - 'tests/test_dedicated_wsl_clickhouse_startup_probe_v3_contract.py'
      - '.github/workflows/dedicated-wsl-clickhouse-startup-probe-v3-runtime.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows-powershell51:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse and freeze state-authoritative startup probe V3 under Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'scripts/probe-dedicated-wsl-clickhouse-startup-v3.ps1'
          $tokens = $null
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $path),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw 'PowerShell 5.1 parser errors found.'
          }
          $text = Get-Content -LiteralPath $path -Raw
          $required = @(
            '[switch]$Apply',
            'probe_v3_stage=v2_preflight',
            'READY_FOR_NATIVE_STARTUP_PROBE_V2',
            '$previous = $ErrorActionPreference',
            "$ErrorActionPreference = 'Continue'",
            '$output = @(& powershell.exe @args 2>&1)',
            '$exitCode = $LASTEXITCODE',
            'finally { $ErrorActionPreference = $previous }',
            'child_powershell_stderr_capture_safe=True',
            'probe_v3_stage=state_authoritative_mount',
            'MOUNT_COMMAND_EXIT_NONZERO_STATE_VERIFIED_',
            'mount_acceptance_authority=findmnt_ext4_state',
            'probe_v3_stage=v2_apply',
            'probe_v3_stage=state_authoritative_cleanup',
            'UNMOUNT_COMMAND_EXIT_NONZERO_STATE_VERIFIED_',
            'unmount_acceptance_authority=findmnt_detached_state',
            'NATIVE_STARTUP_PROBE_V3_CLEANUP_BLOCKED',
            'runtime_distro_unregister_performed=False',
            'spike_vhdx_delete_performed=False',
            'production_clickhouse_restart_performed=False',
            'production_clickhouse_mutation_performed=False',
            'accepted_volume_mutation_performed=False',
            'corpus_replay_performed=False',
            'DEDICATED_WSL_CLICKHOUSE_STARTUP_PROBE_V3_DONE'
          )
          foreach ($marker in $required) {
            if (-not $text.Contains($marker)) { throw "Missing required marker: $marker" }
          }
          $forbidden = @(
            '$lines = @(& powershell.exe @args 2>&1',
            '--unregister',
            'mkfs.ext4',
            'Remove-Item',
            "docker','prune",
            "docker','volume','rm"
          )
          foreach ($marker in $forbidden) {
            if ($text.Contains($marker)) { throw "Forbidden behavior found: $marker" }
          }
          Write-Host 'DEDICATED_WSL_CLICKHOUSE_STARTUP_PROBE_V3_PS51_CONTRACT_PASS'
