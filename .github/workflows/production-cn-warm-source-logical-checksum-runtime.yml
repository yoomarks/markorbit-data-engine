name: Production CN Warm Source Logical Checksum Runtime

on:
  pull_request:
    paths:
      - 'scripts/freeze-production-cn-warm-source-logical-checksums-v2.ps1'
      - 'tests/test_production_cn_warm_source_logical_checksum_contract.py'
      - '.github/workflows/production-cn-warm-source-logical-checksum-runtime.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows-powershell51:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse and exercise CN Warm source checksum V2 under Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $scriptPath = Join-Path $PWD 'scripts\freeze-production-cn-warm-source-logical-checksums-v2.ps1'
          $source = Get-Content -LiteralPath $scriptPath -Raw -Encoding UTF8
          $tokens = $null
          $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile($scriptPath, [ref]$tokens, [ref]$errors)
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Host $_.Message }
            throw 'CN Warm source checksum V2 failed Windows PowerShell 5.1 parse.'
          }

          $paramNames = @($ast.ParamBlock.Parameters | ForEach-Object { $_.Name.VariablePath.UserPath })
          foreach ($required in @('ExpectedMainSha','AcceptedDesignReceiptPath','ContractOnly')) {
            if ($paramNames -notcontains $required) { throw "CN Warm source checksum V2 missing required parameter: $required" }
          }
          if ($paramNames -contains 'Apply') { throw 'CN Warm source checksum V2 must not expose Apply.' }

          $commandNames = @($ast.FindAll({
            param($node)
            $node -is [System.Management.Automation.Language.CommandAst]
          }, $true) | ForEach-Object { $_.GetCommandName() } | Where-Object { $_ })
          foreach ($forbidden in @('New-VHD','Resize-VHD','Mount-VHD','Dismount-VHD','Optimize-VHD')) {
            if ($commandNames -contains $forbidden) { throw "Forbidden VHDX mutation command present: $forbidden" }
          }
          foreach ($forbiddenText in @('--mount','--unmount','--shutdown','--unregister','docker system prune','docker volume rm','ALTER TABLE markorbit_facts','INSERT INTO markorbit_facts','OPTIMIZE TABLE markorbit_facts','DROP TABLE markorbit_facts','TRUNCATE TABLE markorbit_facts')) {
            if ($source.IndexOf($forbiddenText, [System.StringComparison]::OrdinalIgnoreCase) -ge 0) {
              throw "Forbidden destructive surface present: $forbiddenText"
            }
          }

          if ($source -notmatch [regex]::Escape('cityHash64(toJSONString(tuple(*)))')) {
            throw 'NULL-safe V2 row hash expression missing.'
          }

          $output = powershell.exe -NoProfile -ExecutionPolicy Bypass -File $scriptPath `
            -ExpectedMainSha $env:GITHUB_SHA `
            -AcceptedDesignReceiptPath 'C:\fixture\unused.json' `
            -ContractOnly
          $contractExit = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($contractExit -ne 0) { throw "ContractOnly exited $contractExit." }
          if (($output -join "`n") -notmatch 'PRODUCTION_CN_WARM_SOURCE_LOGICAL_CHECKSUM_V2_CONTRACT_DIRECT_INVOCATION_OK') {
            throw 'V2 ContractOnly success marker missing.'
          }

  python-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run source checksum V2 contract test
        run: python -m pytest tests/test_production_cn_warm_source_logical_checksum_contract.py -q

  clickhouse-nullable-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Prove NULL-safe checksum on exact ClickHouse 24.8.14.39
        shell: bash
        run: |
          set -euo pipefail
          image='clickhouse/clickhouse-server:24.8.14.39'
          query="SELECT count() AS rows, sum(cityHash64(toJSONString(tuple(*)))) AS checksum_sum, groupBitXor(cityHash64(toJSONString(tuple(*)))) AS checksum_xor FROM values('id UInt64, n Nullable(Int32), s Nullable(String)', (1, NULL, 'alpha'), (2, 7, NULL), (3, NULL, '')) FORMAT TabSeparatedRaw"
          output="$(docker run --rm --entrypoint clickhouse "$image" local --query "$query")"
          printf 'nullable_v2_checksum_raw=%s\n' "$output"
          IFS=$'\t' read -r rows checksum_sum checksum_xor <<< "$output"
          test "$rows" = '3'
          [[ "$checksum_sum" =~ ^[0-9]+$ ]]
          [[ "$checksum_xor" =~ ^[0-9]+$ ]]
          printf 'nullable_v2_checksum_rows=3\n'
          printf 'nullable_v2_checksum_sum=%s\n' "$checksum_sum"
          printf 'nullable_v2_checksum_xor=%s\n' "$checksum_xor"
