name: Production CN Warm Source Logical Checksum Runtime

on:
  pull_request:
    paths:
      - 'scripts/freeze-production-cn-warm-source-logical-checksums.ps1'
      - 'tests/test_production_cn_warm_source_logical_checksum_contract.py'
      - '.github/workflows/production-cn-warm-source-logical-checksum-runtime.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows-powershell51:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse and exercise CN Warm source checksum under Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $scriptPath = Join-Path $PWD 'scripts\freeze-production-cn-warm-source-logical-checksums.ps1'
          $source = Get-Content -LiteralPath $scriptPath -Raw -Encoding UTF8
          $tokens = $null
          $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile($scriptPath, [ref]$tokens, [ref]$errors)
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Host $_.Message }
            throw 'CN Warm source checksum failed Windows PowerShell 5.1 parse.'
          }

          $paramNames = @($ast.ParamBlock.Parameters | ForEach-Object { $_.Name.VariablePath.UserPath })
          foreach ($required in @('ExpectedMainSha','AcceptedDesignReceiptPath','ContractOnly')) {
            if ($paramNames -notcontains $required) { throw "CN Warm source checksum missing required parameter: $required" }
          }
          if ($paramNames -contains 'Apply') { throw 'CN Warm source checksum must not expose Apply.' }

          $commandNames = @($ast.FindAll({
            param($node)
            $node -is [System.Management.Automation.Language.CommandAst]
          }, $true) | ForEach-Object { $_.GetCommandName() } | Where-Object { $_ })
          foreach ($forbidden in @('New-VHD','Resize-VHD','Mount-VHD','Dismount-VHD','Optimize-VHD')) {
            if ($commandNames -contains $forbidden) { throw "Forbidden VHDX mutation command present: $forbidden" }
          }
          foreach ($forbiddenText in @('--mount','--unmount','--shutdown','--unregister','docker system prune','docker volume rm','ALTER TABLE markorbit_facts','INSERT INTO markorbit_facts','OPTIMIZE TABLE markorbit_facts','DROP TABLE markorbit_facts','TRUNCATE TABLE markorbit_facts')) {
            if ($source.IndexOf($forbiddenText, [System.StringComparison]::OrdinalIgnoreCase) -ge 0) {
              throw "Forbidden destructive surface present: $forbiddenText"
            }
          }

          $output = powershell.exe -NoProfile -ExecutionPolicy Bypass -File $scriptPath `
            -ExpectedMainSha $env:GITHUB_SHA `
            -AcceptedDesignReceiptPath 'C:\fixture\unused.json' `
            -ContractOnly
          $contractExit = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($contractExit -ne 0) { throw "ContractOnly exited $contractExit." }
          if (($output -join "`n") -notmatch 'PRODUCTION_CN_WARM_SOURCE_LOGICAL_CHECKSUM_CONTRACT_DIRECT_INVOCATION_OK') {
            throw 'ContractOnly success marker missing.'
          }

  python-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run source checksum contract test
        run: python -m pytest tests/test_production_cn_warm_source_logical_checksum_contract.py -q
