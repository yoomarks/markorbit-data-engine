name: Cancel Superseded PR Runs

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

# Security boundary: this workflow never checks out pull-request code. It only
# inspects Actions metadata for the current PR and cancels older PR-event runs.
permissions:
  actions: write
  contents: read

jobs:
  cancel-superseded:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Cancel older workflow runs for this pull request
        uses: actions/github-script@v7
        with:
          script: |
            const number = context.payload.pull_request.number;
            const currentSha = context.payload.pull_request.head.sha;
            const branch = context.payload.pull_request.head.ref;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const cancellable = new Set(['queued', 'in_progress', 'waiting', 'requested', 'pending']);
            const cancelled = new Set();
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            // Run several short passes because pull_request workflow runs for the
            // same synchronize event may be registered a few seconds apart.
            for (let pass = 0; pass < 3; pass += 1) {
              const runs = await github.paginate(
                github.rest.actions.listWorkflowRunsForRepo,
                {
                  owner,
                  repo,
                  event: 'pull_request',
                  branch,
                  per_page: 100,
                },
              );

              for (const run of runs) {
                if (run.head_sha === currentSha || !cancellable.has(run.status)) {
                  continue;
                }
                const belongsToCurrentPr = (run.pull_requests || []).some(
                  (pr) => pr.number === number,
                );
                if (!belongsToCurrentPr || cancelled.has(run.id)) {
                  continue;
                }

                try {
                  await github.rest.actions.cancelWorkflowRun({
                    owner,
                    repo,
                    run_id: run.id,
                  });
                  cancelled.add(run.id);
                  core.info(`Cancelled superseded run ${run.id} (${run.name}) at ${run.head_sha}`);
                } catch (error) {
                  // A run can complete between listing and cancellation. Treat
                  // those races as benign; permission/auth failures still fail.
                  if (error.status === 409 || error.status === 422) {
                    core.info(`Run ${run.id} was already non-cancellable: ${error.message}`);
                    continue;
                  }
                  throw error;
                }
              }

              if (pass < 2) {
                await sleep(5000);
              }
            }

            core.notice(`Cancelled ${cancelled.size} superseded pull-request workflow run(s) for PR #${number}.`);
