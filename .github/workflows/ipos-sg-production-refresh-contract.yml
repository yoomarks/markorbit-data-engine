name: IPOS SG Production Refresh Contract

on:
  pull_request:
    paths:
      - 'scripts/run-ipos-sg.ps1'
      - 'tests/test_ipos_sg_operator_scripts.py'
      - 'docs/SINGAPORE_IPOS_OPERATOR_RUNBOOK.md'
      - '.github/workflows/ipos-sg-production-refresh-contract.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  windows-powershell51:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Execute SG production-refresh contract under Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -ne 5) {
            throw 'Contract must execute under Windows PowerShell 5.1.'
          }
          $output = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\run-ipos-sg.ps1 -ContractOnly 2>&1
          $output | Write-Host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $text = $output -join [Environment]::NewLine
          if ($text -notmatch 'IPOS_SG_PRODUCTION_REFRESH_CONTRACT_PASS') {
            throw 'SG production-refresh contract marker missing.'
          }
