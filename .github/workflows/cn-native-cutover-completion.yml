name: CN Native Cutover Completion

on:
  pull_request:
    paths:
      - 'app/cn/**'
      - 'app/cn_mark_image/**'
      - 'app/cn_qcc/**'
      - 'app/trademark_framework/**'
      - 'app/trademark_factory/**'
      - 'app/db.py'
      - 'app/config.py'
      - 'app/component_versions.py'
      - 'database/**'
      - 'docker/**'
      - 'docker-compose*.yml'
      - '.env.example'
      - 'pyproject.toml'
      - '.github/workflows/cn-native-cutover-completion.yml'
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify CN native cutover completion contract
        run: python -m app.cn.native_cutover_completion
