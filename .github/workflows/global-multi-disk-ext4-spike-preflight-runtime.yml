name: Global Multi-Disk Ext4 Spike Preflight Runtime

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  windows-powershell51:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse ext4 spike preflight under Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          if ($PSVersionTable.PSVersion.Major -ne 5) {
              throw "This guard must execute under Windows PowerShell 5.1."
          }
          foreach ($command in @('wsl.exe','docker','Get-CimInstance','diskpart.exe')) {
              if (-not (Get-Command $command -ErrorAction SilentlyContinue)) {
                  throw "Required preflight command missing: $command"
              }
          }
          $path = Resolve-Path '.\scripts\preflight-global-multi-disk-ext4-spike.ps1'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
              foreach ($parseError in $errors) {
                  Write-Host "::error::$($parseError.Message)"
              }
              throw "Ext4 spike preflight failed Windows PowerShell 5.1 parsing."
          }
          $command = Get-Command $path
          foreach ($parameter in @('ExpectedMainSha','AcceptedVolume')) {
              if (-not $command.Parameters.ContainsKey($parameter)) {
                  throw "Preflight operator must retain parameter: $parameter"
              }
          }
          $text = Get-Content -LiteralPath $path -Raw -Encoding UTF8
          foreach ($required in @(
              'GLOBAL_MULTI_DISK_EXT4_SPIKE_PREFLIGHT_V1',
              'READY_FOR_BOUNDED_EXT4_SPIKE',
              'SPIKE_PREFLIGHT_BLOCKED',
              'destructive_action_performed = $false',
              'vhdx_create_performed = $false',
              'corpus_replay_performed = $false',
              '$workerProbe = Invoke-NativeText',
              "$workerProbe['lines']",
              "wsl.exe' @('--help')",
              'wsl_help_mount_supported=',
              'wsl_help_vhd_option_supported=',
              'wsl_help_install_location_supported=',
              'windows_build_number='
          )) {
              if (-not $text.Contains($required)) {
                  throw "Preflight lost required safety/runtime marker: $required"
              }
          }
          if ($text.Contains("@(Invoke-NativeText 'docker' @('ps','-aq'")) {
              throw 'Preflight must not use PS5.1-unstable inline array member access for worker probe.'
          }
          if ($text.Contains("wsl.exe' @('--mount','--help')")) {
              throw 'Preflight must detect WSL capability from canonical wsl --help, not subcommand help.'
          }
          $emptyProbe = [ordered]@{ exit_code = 0; lines = @() }
          $emptyIds = @($emptyProbe['lines'] | Where-Object { $_.Trim() })
          if ($emptyIds.Count -ne 0) {
              throw 'Empty PS5.1 worker probe shape did not remain empty.'
          }
          $oneProbe = [ordered]@{ exit_code = 0; lines = @('abc123') }
          $oneIds = @($oneProbe['lines'] | Where-Object { $_.Trim() })
          if ($oneIds.Count -ne 1 -or $oneIds[0] -ne 'abc123') {
              throw 'Single-line PS5.1 worker probe shape was not preserved.'
          }
          $syntheticHelp = "  --mount <DiskPath>`n      --vhd`n  --install <Distro>`n      --location <Location>"
          $mountSupported = [bool]($syntheticHelp -match '(?im)(^|\s)--mount(\s|$)')
          $vhdSupported = [bool]($syntheticHelp -match '(?im)(^|\s)--vhd(\s|$)')
          $locationSupported = [bool]($syntheticHelp -match '(?im)(^|\s)--location(\s|$)')
          if (-not $mountSupported -or -not $vhdSupported -or -not $locationSupported) {
              throw 'PS5.1 WSL canonical-help capability parser failed synthetic feature text.'
          }
          Write-Host WINDOWS_POWERSHELL_51_GLOBAL_MULTI_DISK_EXT4_SPIKE_PREFLIGHT_PASS
