name: Production Storage Rebalance Guarded Apply Runtime

on:
  pull_request:
    paths:
      - 'scripts/run-production-storage-rebalance-guarded-apply.ps1'
      - 'tests/test_production_storage_rebalance_guarded_apply_contract.py'
      - '.github/workflows/production-storage-rebalance-guarded-apply-runtime.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  windows-powershell51:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse and freeze retired legacy operator under Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -ne 5) {
            throw 'Legacy rebalance retirement contract must execute under Windows PowerShell 5.1.'
          }

          $path = Resolve-Path 'scripts\run-production-storage-rebalance-guarded-apply.ps1'
          $tokens = $null
          $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw 'PowerShell 5.1 parser errors detected in retired legacy rebalance operator.'
          }

          $command = Get-Command $path
          foreach ($parameter in @(
            'ExpectedMainSha','Phase','AcceptedVolume','LegacyRawRoot','RawTargetRoot',
            'LegacyEHotRoot','LegacyEHotLogsRoot','EvidenceRoot',
            'AcknowledgeTemporary20Percent','Apply'
          )) {
            if (-not $command.Parameters.ContainsKey($parameter)) {
              throw "Retired legacy operator lost compatibility parameter: $parameter"
            }
          }

          $text = Get-Content -LiteralPath $path -Raw -Encoding UTF8
          foreach ($required in @(
            "[ValidateSet('Phase1E','Phase2D')]",
            'LEGACY_STORAGE_REBALANCE_OPERATOR_RETIRED',
            'mutation_performed=False',
            'run-production-rebalance-phase1-e-reparse-safe-delete.ps1',
            'run-production-rebalance-phase2-d-resumable-apply.ps1',
            'run-production-rebalance-phase2-d-resumable-delete.ps1',
            'Legacy Phase1E recursive-delete path is retired',
            'Legacy generic Phase2D entry point is retired'
          )) {
            if (-not $text.Contains($required)) { throw "Missing retirement marker: $required" }
          }

          $removeCommands = @($ast.FindAll({
            param($node)
            $node -is [System.Management.Automation.Language.CommandAst] -and
              $node.GetCommandName() -eq 'Remove-Item'
          }, $true))
          if ($removeCommands.Count -ne 0) {
            throw "Retired legacy operator must contain zero Remove-Item call sites; observed $($removeCommands.Count)."
          }

          foreach ($forbidden in @(
            'Move-Item','Copy-Item','robocopy','rsync','System.IO.File]::Delete',
            'System.IO.Directory]::Delete','docker volume rm','docker system prune',
            'docker compose down','docker compose restart','wsl.exe --shutdown',
            'wsl.exe --unmount','ALTER TABLE','OPTIMIZE TABLE','Invoke-Expression','Start-Process'
          )) {
            if ($text.Contains($forbidden)) { throw "Mutation primitive found in retired legacy operator: $forbidden" }
          }

          foreach ($phase in @('Phase1E','Phase2D')) {
            $blocked = $false
            try {
              & $path -ExpectedMainSha ('0' * 40) -Phase $phase -Apply
            }
            catch {
              $blocked = $true
              if ($_.Exception.Message -notmatch 'retired') {
                throw "Retired $phase path failed for an unexpected reason: $($_.Exception.Message)"
              }
            }
            if (-not $blocked) { throw "Retired $phase path unexpectedly returned without blocking." }
          }

          Write-Host 'PRODUCTION_STORAGE_REBALANCE_LEGACY_OPERATOR_RETIRED_PS51_CONTRACT_PASS'
