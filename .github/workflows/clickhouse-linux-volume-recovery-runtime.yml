name: ClickHouse Linux Volume Recovery Runtime

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  recovery-helper-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify ClickHouse recovery helper commands
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh clickhouse/clickhouse-server:24.8 -lc '
            set -eu
            for cmd in find awk cp rm du df timeout sha256sum sync; do
              command -v "$cmd" >/dev/null
            done
            mkdir -p /tmp/recovery-src/a /tmp/recovery-dst
            printf test > /tmp/recovery-src/a/file
            ln /tmp/recovery-src/a/file /tmp/recovery-src/hardlink
            ln -s a/file /tmp/recovery-src/symlink
            cp -a /tmp/recovery-src/. /tmp/recovery-dst/
            test "$(stat -c %h /tmp/recovery-dst/a/file)" -ge 2
            test "$(readlink /tmp/recovery-dst/symlink)" = "a/file"
            timeout 5s sh -c "exit 0"
            du -s -B1 /tmp/recovery-dst >/dev/null
            df -B1 /tmp/recovery-dst >/dev/null
            find /tmp/recovery-dst -mindepth 1 -printf "%P\n" | LC_ALL=C sort | sha256sum >/dev/null

            stats="$(find /tmp/recovery-dst -type f -printf "%s\n" | awk "{bytes += \$1; count += 1} END {printf \"%.0f\\t%.0f\", bytes, count}")"
            symlinks="$(find /tmp/recovery-dst -type l -printf ".\n" | wc -l | tr -d " ")"
            dirs="$(find /tmp/recovery-dst -mindepth 1 -type d -printf ".\n" | wc -l | tr -d " ")"
            digest="$(find /tmp/recovery-dst -mindepth 1 \( -type d -printf "D\\t%P\\n" -o -type f -printf "F\\t%P\\t%s\\t%n\\n" -o -type l -printf "L\\t%P\\t%l\\n" \) | LC_ALL=C sort | sha256sum | awk "{print \$1}")"
            manifest="$(printf "%s\\t%s\\t%s\\t%s\\n" "$stats" "$symlinks" "$dirs" "$digest")"
            test "$(printf "%s\n" "$manifest" | wc -l | tr -d " ")" = "1"
            test "$(printf "%s\n" "$manifest" | awk -F "\\t" "{print NF}")" = "5"
            printf "%s\n" "$manifest" | awk -F "\\t" "length(\$5) == 64 && \$5 ~ /^[0-9a-f]+$/ {ok=1} END {exit !ok}"

            mkdir -p /tmp/identity/metadata/db /tmp/identity/store/abc/abcdef00-0000-0000-0000-000000000001
            printf metadata > /tmp/identity/metadata/db/table.sql
            ln -s db/table.sql /tmp/identity/metadata/table-link
            metadata_count="$(find /tmp/identity/metadata -mindepth 1 \( -type f -o -type l \) -printf ".\n" | wc -l | tr -d " ")"
            metadata_sha="$(find /tmp/identity/metadata -mindepth 1 \( -type d -printf "D\\t%P\\n" -o -type f -printf "F\\t%P\\t%s\\n" -o -type l -printf "L\\t%P\\t%l\\n" \) | LC_ALL=C sort | sha256sum | awk "{print \$1}")"
            store_uuid_count="$(find /tmp/identity/store -mindepth 2 -maxdepth 2 -type d -printf ".\n" | wc -l | tr -d " ")"
            store_uuid_sha="$(find /tmp/identity/store -mindepth 2 -maxdepth 2 -type d -printf "%P\n" | LC_ALL=C sort | sha256sum | awk "{print \$1}")"
            identity="$(printf "%s\\t%s\\t%s\\t%s\\n" "$metadata_count" "$metadata_sha" "$store_uuid_count" "$store_uuid_sha")"
            test "$(printf "%s\n" "$identity" | awk -F "\\t" "{print NF}")" = "4"
            printf "%s\n" "$identity" | awk -F "\\t" "length(\$2) == 64 && length(\$4) == 64 {ok=1} END {exit !ok}"
          '
          echo CLICKHOUSE_LINUX_VOLUME_RECOVERY_HELPER_RUNTIME_PASS
