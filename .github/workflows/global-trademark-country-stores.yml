name: Global Trademark Country Stores

on:
  pull_request:
    paths:
      - 'app/global_trademarks/**'
      - 'app/trademark_framework/**'
      - 'app/trademark_factory/**'
      - 'app/trademark_jurisdictions/**'
      - 'app/data_trust.py'
      - 'app/db.py'
      - 'app/config.py'
      - 'app/component_versions.py'
      - 'tests/test_global_trademark*'
      - 'tests/test_component_versions.py'
      - 'tests/test_trademark_*'
      - 'docs/GLOBAL_TRADEMARK_COUNTRY_STORES.md'
      - 'docs/TRADEMARK_JURISDICTION_FRAMEWORK.md'
      - 'docs/TRADEMARK_SOURCE_ACQUISITION.md'
      - 'docs/TRADEMARK_HTTP_TRANSPORT.md'
      - 'docs/TRADEMARK_COUNTRY_FACTORY.md'
      - 'docs/TRADEMARK_NATIVE_STORE_PRIMITIVES.md'
      - 'docs/COMPONENT_VERSIONS.md'
      - '.github/workflows/global-trademark-country-stores.yml'
      - 'api.Dockerfile'
      - 'docker-compose.yml'
      - '.env.example'
      - 'pyproject.toml'
  push:
    branches:
      - main
    paths:
      - 'app/global_trademarks/**'
      - 'app/trademark_framework/**'
      - 'app/trademark_factory/**'
      - 'app/trademark_jurisdictions/**'
      - 'app/data_trust.py'
      - 'app/db.py'
      - 'app/config.py'
      - 'app/component_versions.py'
      - 'tests/test_global_trademark*'
      - 'tests/test_component_versions.py'
      - 'tests/test_trademark_*'
      - 'docs/GLOBAL_TRADEMARK_COUNTRY_STORES.md'
      - 'docs/TRADEMARK_JURISDICTION_FRAMEWORK.md'
      - 'docs/TRADEMARK_SOURCE_ACQUISITION.md'
      - 'docs/TRADEMARK_HTTP_TRANSPORT.md'
      - 'docs/TRADEMARK_COUNTRY_FACTORY.md'
      - 'docs/TRADEMARK_NATIVE_STORE_PRIMITIVES.md'
      - 'docs/COMPONENT_VERSIONS.md'
      - '.github/workflows/global-trademark-country-stores.yml'
      - 'api.Dockerfile'
      - 'docker-compose.yml'
      - '.env.example'
      - 'pyproject.toml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  postgres-fixture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare CI Compose environment
        run: |
          cp .env.example .env
          sed -i 's|^RAW_DATA_PATH=.*|RAW_DATA_PATH=./raw_data|' .env
          mkdir -p raw_data

      - name: Validate jurisdiction framework contracts and scaffold
        run: docker compose run --rm --no-deps worker python -m app.trademark_framework.validate_fixture

      - name: Validate country factory contracts and virtual jurisdiction
        run: docker compose run --rm --no-deps worker python -m app.trademark_factory.validate_fixture

      - name: Validate resilient HTTP transport and pagination contracts
        run: docker compose run --rm --no-deps worker python -m app.trademark_framework.validate_http_transport_fixture

      - name: Validate HTTP transport secret redaction
        run: docker compose run --rm --no-deps worker python -m app.trademark_framework.validate_http_transport_security_fixture

      - name: Validate reusable paginated HTTP acquisition adapter
        run: docker compose run --rm --no-deps worker python -m app.trademark_framework.validate_http_acquisition_adapter_fixture

      - name: Validate resumable source/API acquisition contracts
        run: docker compose run --rm --no-deps worker python -m app.trademark_framework.validate_acquisition_fixture

      - name: Validate no-write source preflight contracts
        run: docker compose run --rm --no-deps worker python -m app.global_trademarks.validate_source_preflight_fixture

      - name: Start PostgreSQL
        run: docker compose up -d --wait postgres

      - name: Run consolidated country-store PostgreSQL fixture suite
        run: docker compose run --rm --no-deps worker python -m app.global_trademarks.validate_ci_suite

      - name: Validate native observation store primitives
        run: docker compose run --rm --no-deps worker python -m app.trademark_framework.validate_native_store_fixture

      - name: Validate mapped observation writer
        run: docker compose run --rm --no-deps worker python -m app.trademark_factory.validate_mapped_writer_fixture

      - name: Validate native store bundle
        run: docker compose run --rm --no-deps worker python -m app.trademark_factory.validate_store_bundle_fixture

      - name: Validate durable native ingest executor
        run: docker compose run --rm --no-deps worker python -m app.trademark_factory.validate_native_ingest_fixture

      - name: Validate native ingest replay truncation
        run: docker compose run --rm --no-deps worker python -m app.trademark_factory.validate_native_ingest_truncation_fixture

      - name: Tear down fixture database
        if: always()
        run: docker compose down -v --remove-orphans
