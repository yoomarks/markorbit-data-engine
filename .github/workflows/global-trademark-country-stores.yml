name: Global Trademark Country Stores

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  postgres-fixture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare CI Compose environment
        run: |
          cp .env.example .env
          sed -i 's|^RAW_DATA_PATH=.*|RAW_DATA_PATH=./raw_data|' .env
          mkdir -p raw_data

      - name: Validate no-write source preflight contracts
        run: docker compose run --rm --no-deps worker python -m app.global_trademarks.validate_source_preflight_fixture

      - name: Start PostgreSQL
        run: docker compose up -d --wait postgres

      # This fixture intentionally creates PR #181-shaped legacy AU/CA tables first.
      # Run it before any current-schema migration fixture on the same PostgreSQL volume.
      - name: Validate legacy upgrade and country-native ingestion
        run: docker compose run --rm --no-deps worker python -m app.global_trademarks.validate_upgrade_fixture

      - name: Validate versioned migration, manifests and execution lock
        run: docker compose run --rm --no-deps worker python -m app.global_trademarks.validate_platform_hardening_fixture

      - name: Validate no-write plan and explicit apply operator contract
        run: docker compose run --rm --no-deps worker python -m app.global_trademarks.validate_operator_fixture

      - name: Validate bounded pilot apply and resume contract
        run: docker compose run --rm --no-deps worker python -m app.global_trademarks.validate_bounded_pilot_fixture

      - name: Validate durable resumable country ingestion
        run: docker compose run --rm --no-deps worker python -m app.global_trademarks.validate_resumable_fixture

      - name: Validate CIPO weekly deletion tombstones
        run: docker compose run --rm --no-deps worker python -m app.global_trademarks.validate_cipo_weekly_fixture

      - name: Validate read-only country readiness audit
        run: docker compose run --rm --no-deps worker python -m app.global_trademarks.validate_readiness_audit

      - name: Validate source-release acceptance and Data Trust boundary
        run: docker compose run --rm --no-deps worker python -m app.global_trademarks.validate_acceptance_fixture

      - name: Tear down fixture database
        if: always()
        run: docker compose down -v --remove-orphans
