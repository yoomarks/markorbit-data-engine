name: Windows PowerShell 5.1 Runtime

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  audit-hot-path-binder:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Windows PowerShell 5.1 Hot-storage operator safety
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "PSEdition=$($PSVersionTable.PSEdition)"
          Write-Host "PSVersion=$($PSVersionTable.PSVersion)"
          if ($PSVersionTable.PSVersion.Major -ne 5) {
              throw "This guard must execute under Windows PowerShell 5.1."
          }

          $operatorPaths = @(
              '.\scripts\audit-clickhouse-hot-path-regression.ps1',
              '.\scripts\prepare-clickhouse-authoritative-hot-recovery.ps1',
              '.\scripts\classify-clickhouse-hot-case-contract-native.ps1',
              '.\scripts\recover-clickhouse-bind-to-linux-volume.ps1'
          )
          foreach ($relativePath in $operatorPaths) {
              $operatorPath = Resolve-Path $relativePath
              $text = Get-Content -LiteralPath $operatorPath -Raw -Encoding UTF8
              if ($text -match 'System\.Collections\.Generic\.List\[object\]') {
                  throw "$relativePath uses Generic.List[object], which can trigger the PowerShell 5.1 array-subexpression binder bug."
              }
              if ($text -match 'return\s+@\(\$rows\)') {
                  throw "$relativePath uses return @(`$rows), which can trigger the PowerShell 5.1 generic-list binder bug."
              }

              $tokens = $null
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                  $operatorPath,
                  [ref]$tokens,
                  [ref]$errors
              ) | Out-Null
              if ($errors.Count -gt 0) {
                  foreach ($parseError in $errors) {
                      Write-Host "::error file=$relativePath::$($parseError.Message)"
                  }
                  throw "$relativePath failed Windows PowerShell 5.1 parsing."
              }

              $command = Get-Command $operatorPath
              if (-not $command.Parameters.ContainsKey('ExpectedMainSha')) {
                  throw "$relativePath must retain the ExpectedMainSha exact-main contract."
              }
          }

          $classifierPath = Resolve-Path '.\scripts\classify-clickhouse-hot-case-contract-native.ps1'
          $classifierText = Get-Content -LiteralPath $classifierPath -Raw -Encoding UTF8
          if ($classifierText -notmatch 'GetFileInformationByName') {
              throw "Native Hot case classifier must use GetFileInformationByName."
          }
          if ($classifierText -match 'fsutil\.exe\s+file\s+queryCaseSensitiveInfo') {
              throw "Native Hot case classifier must not parse localized fsutil text."
          }
          if ($classifierText -notmatch 'ALL_ENABLED' -or
              $classifierText -notmatch 'ALL_DISABLED' -or
              $classifierText -notmatch 'MIXED' -or
              $classifierText -notmatch 'INCOMPLETE') {
              throw "Native Hot case classifier must retain all four classification states."
          }

          $recoveryPath = Resolve-Path '.\scripts\recover-clickhouse-bind-to-linux-volume.ps1'
          $recoveryText = Get-Content -LiteralPath $recoveryPath -Raw -Encoding UTF8
          foreach ($required in @(
              'markorbit-data-engine_clickhouse_data',
              'STRUCTURAL_COPY_PARITY_OK',
              'native_mergetree_commit_verified=True',
              'ROLLBACK_TO_UNTOUCHED_WINDOWS_BIND_PASS'
          )) {
              if ($recoveryText -notmatch [regex]::Escape($required)) {
                  throw "Linux-volume recovery is missing required safety marker: $required"
              }
          }

          $rows = @()
          $rows += [pscustomobject][ordered]@{ label = 'root'; exists = $true }
          $rows += [pscustomobject][ordered]@{ label = 'store'; exists = $true }
          $materialized = @($rows)
          if ($materialized.Count -ne 2) {
              throw "PowerShell 5.1 binder-safe object-array materialization failed."
          }

          if (-not [string]::Equals('E:\\Hot', 'e:\\hot', [System.StringComparison]::OrdinalIgnoreCase)) {
              throw "Static ordinal-ignore-case comparison contract failed."
          }

          Write-Host "WINDOWS_POWERSHELL_51_HOT_STORAGE_OPERATOR_GUARD_PASS"
