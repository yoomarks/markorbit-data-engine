name: CI Concurrency Migration

on:
  push:
    branches:
      - ci/cancel-superseded-pr-runs
    paths:
      - '.github/workflows/ci-concurrency-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add pull-request concurrency contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.github/workflows')
          migration = root / 'ci-concurrency-migration.yml'
          block = (
              'concurrency:\n'
              '  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}\n'
              "  cancel-in-progress: ${{ github.event_name == 'pull_request' }}\n"
          )
          changed = []
          skipped = []
          for path in sorted(root.glob('*.yml')):
              if path == migration:
                  continue
              text = path.read_text(encoding='utf-8')
              if not re.search(r'(?m)^  pull_request\s*:', text):
                  skipped.append(path.name)
                  continue

              if re.search(r'(?m)^concurrency:\s*$', text):
                  updated, count = re.subn(
                      r'(?ms)^concurrency:\s*\n(?:^[ \t]+.*\n)+',
                      block + '\n',
                      text,
                      count=1,
                  )
                  if count != 1:
                      raise SystemExit(f'Could not replace concurrency block in {path}')
              else:
                  markers = ['\npermissions:\n', '\njobs:\n']
                  index = next((text.find(marker) for marker in markers if text.find(marker) >= 0), -1)
                  if index < 0:
                      raise SystemExit(f'No safe insertion point in {path}')
                  updated = text[: index + 1] + block + '\n' + text[index + 1 :]

              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(path.name)

          migration.unlink()
          print(f'updated={len(changed)}')
          print('\n'.join(changed))
          print(f'skipped_non_pr={len(skipped)}')
          print('\n'.join(skipped))
          if len(changed) < 1:
              raise SystemExit('No PR-triggered workflows were updated')
          PY

      - name: Commit migration result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows
          git diff --cached --check
          git commit -m 'CI: cancel superseded pull-request workflow runs'
          git push origin HEAD:ci/cancel-superseded-pr-runs
