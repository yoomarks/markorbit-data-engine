name: ClickHouse Cutover Contract

on:
  pull_request:
    paths:
      - "scripts/migrate-clickhouse-volume-to-hot.ps1"
      - "tests/test_clickhouse_hot_cutover_operator.py"
      - ".github/workflows/clickhouse-cutover-contract.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/migrate-clickhouse-volume-to-hot.ps1"
      - "tests/test_clickhouse_hot_cutover_operator.py"
      - ".github/workflows/clickhouse-cutover-contract.yml"

permissions:
  contents: read

jobs:
  clickhouse-cutover-helper-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Verify helper commands and metadata manifest primitives
        run: |
          docker run --rm --entrypoint sh clickhouse/clickhouse-server:24.8 -lc '
            set -eu
            for cmd in find awk cp grep mkdir mv ln id chown chmod stat sort sha256sum wc tr rm; do
              command -v "$cmd"
            done

            root=/tmp/markorbit-cutover-contract
            rm -rf "$root"
            mkdir -p "$root/dir"
            printf test > "$root/dir/source"
            mv "$root/dir/source" "$root/dir/renamed"
            mv "$root/dir" "$root/dir-renamed"
            ln "$root/dir-renamed/renamed" "$root/hardlink"
            ln -s dir-renamed/renamed "$root/symlink"
            chmod 640 "$root/dir-renamed/renamed" "$root/hardlink"
            test "$(stat -c %a "$root/dir-renamed/renamed")" = 640
            test "$(stat -c %h "$root/dir-renamed/renamed")" -ge 2
            grep -qx test "$root/hardlink"
            grep -qx test "$root/symlink"

            digest="$(find "$root" -mindepth 1 \( -type d -printf "D\t%P\n" -o -type f -printf "F\t%P\t%s\t%n\n" -o -type l -printf "L\t%P\t%l\n" \) | LC_ALL=C sort | sha256sum | awk "{print \$1}")"
            printf "%s\n" "$digest" | grep -Eq "^[0-9a-f]{64}$"
            rm -rf "$root"
          '
