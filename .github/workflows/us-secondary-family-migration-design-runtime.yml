name: US Secondary Family Migration Design Runtime

on:
  pull_request:
    paths:
      - 'scripts/design-us-secondary-family-hot-migration.ps1'
      - 'scripts/audit-us-secondary-family-hot-placement.ps1'
      - 'tests/test_us_secondary_family_migration_design_contract.py'
      - 'database/clickhouse/init/009_us_assignment_m10.sql'
      - 'database/clickhouse/init/010_us_ttab_m10.sql'
      - 'database/clickhouse/init/011_us_ttab_m11_real_rawxml.sql'
      - 'database/clickhouse/init/012_us_ttab_m12_official_bulk.sql'
      - 'app/us_assignment/publisher.py'
      - 'app/us_ttab/publisher.py'
      - '.github/workflows/us-secondary-family-migration-design-runtime.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows-powershell51:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse and exercise US secondary-family design under Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $scriptPath = Join-Path $PWD 'scripts\design-us-secondary-family-hot-migration.ps1'
          $source = Get-Content -LiteralPath $scriptPath -Raw -Encoding UTF8
          $tokens = $null
          $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile($scriptPath, [ref]$tokens, [ref]$errors)
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Host $_.Message }
            throw 'US secondary-family migration design failed Windows PowerShell 5.1 parse.'
          }

          $paramNames = @($ast.ParamBlock.Parameters | ForEach-Object { $_.Name.VariablePath.UserPath })
          foreach ($required in @('ExpectedMainSha','PythonExe','EvidenceRoot','ContractOnly')) {
            if ($paramNames -notcontains $required) { throw "Missing required parameter: $required" }
          }
          if ($paramNames -contains 'Apply' -or $paramNames -contains 'Resume') {
            throw 'Design operator must not expose Apply or Resume.'
          }

          $commandNames = @($ast.FindAll({
            param($node)
            $node -is [System.Management.Automation.Language.CommandAst]
          }, $true) | ForEach-Object { $_.GetCommandName() } | Where-Object { $_ })
          foreach ($forbidden in @('New-VHD','Resize-VHD','Mount-VHD','Dismount-VHD','Optimize-VHD')) {
            if ($commandNames -contains $forbidden) { throw "Forbidden VHDX mutation command present: $forbidden" }
          }
          foreach ($forbiddenText in @('--shutdown','--unregister','docker system prune','docker volume rm')) {
            if ($source.IndexOf($forbiddenText, [System.StringComparison]::OrdinalIgnoreCase) -ge 0) {
              throw "Forbidden destructive surface present: $forbiddenText"
            }
          }

          $output = powershell.exe -NoProfile -ExecutionPolicy Bypass -File $scriptPath `
            -ExpectedMainSha $env:GITHUB_SHA `
            -ContractOnly
          $contractExit = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($contractExit -ne 0) { throw "ContractOnly exited $contractExit." }
          if (($output -join "`n") -notmatch 'US_SECONDARY_FAMILY_MIGRATION_DESIGN_CONTRACT_PASS') {
            throw 'ContractOnly success marker missing.'
          }

          Write-Host 'US_SECONDARY_FAMILY_MIGRATION_DESIGN_WINDOWS_PS51_PASS'

  python-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run migration design contract test
        run: python -m pytest tests/test_us_secondary_family_migration_design_contract.py -q
