name: Dedicated WSL ClickHouse Full Acceptance V3 Runtime

on:
  pull_request:
    paths:
      - 'scripts/run-dedicated-wsl-clickhouse-full-acceptance-v3.ps1'
      - 'tests/test_dedicated_wsl_clickhouse_full_acceptance_v3_contract.py'
      - '.github/workflows/dedicated-wsl-clickhouse-full-acceptance-v3-runtime.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows-powershell51:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse and freeze full acceptance V3 under Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'scripts/run-dedicated-wsl-clickhouse-full-acceptance-v3.ps1'
          $tokens = $null
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $path),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw 'PowerShell 5.1 parser errors found.'
          }
          $text = Get-Content -LiteralPath $path -Raw
          $required = @(
            '[switch]$Apply',
            'run-dedicated-wsl-clickhouse-full-acceptance-v2.ps1',
            'recovery_gate_authority=stable_ascii_v2_receipt',
            'recovery_unmount_argument_authority=unquoted_exact_no_whitespace_retained_vhdx_path',
            'acceptance_v3_recovery_gate=',
            'acceptance_v3_stage=stale_attachment_recovery',
            'acceptance_v3_stage=v2_retry_once',
            'stale_attachment_retry_limit=1',
            'stale_attachment_recovery_scope=retained_spike_vhdx_only',
            '$first[''runtime_stage''] -eq ''mount_external_disks''',
            '$first[''server_stopped''] -eq ''True''',
            '$first[''production_after_ready''] -eq ''True''',
            '$first[''accepted_volume_after_present''] -eq ''True''',
            '$first[''worker_count_after''] -eq ''0''',
            '$allowedVhdxPaths -notcontains $VhdxPath',
            'Retained spike VHDX path must remain whitespace/quote free for exact WSL detach',
            '$argumentText = ''--unmount '' + $VhdxPath',
            '$process.Refresh()',
            '[int]$process.ExitCode',
            'recovery_gate_decision=',
            'recovery_gate_stage=',
            'recovery_gate_server_stopped=',
            'recovery_gate_production=',
            'recovery_gate_accepted_volume=',
            'recovery_gate_workers=',
            'WaitForExit($TimeoutSeconds * 1000)',
            'wsl_shutdown_performed=False',
            'runtime_distro_unregister_performed=False',
            'spike_vhdx_delete_performed=False',
            'production_clickhouse_mutation_performed=False',
            'accepted_volume_mutation_performed=False',
            'corpus_replay_performed=False',
            'DEDICATED_WSL_CLICKHOUSE_FULL_ACCEPTANCE_V3_DONE'
          )
          foreach ($marker in $required) {
            if (-not $text.Contains($marker)) { throw "Missing required marker: $marker" }
          }
          $forbidden = @(
            'WSL_E_DISK_ALREADY_MOUNTED',
            '--unmount "',
            '--unregister',
            'mkfs.ext4',
            'wsl --shutdown',
            "docker','prune",
            "docker','volume','rm",
            '2023_5.zip',
            '-Apply -All'
          )
          foreach ($marker in $forbidden) {
            if ($text.Contains($marker)) { throw "Forbidden behavior found: $marker" }
          }
          Write-Host 'DEDICATED_WSL_CLICKHOUSE_FULL_ACCEPTANCE_V3_PS51_CONTRACT_PASS'
