name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Ruff
        run: python -m ruff check app tests

      - name: Pytest
        run: python -m pytest -q

  windows-powershell:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse all PowerShell operator scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $failed = $false
          Get-ChildItem -Path .\scripts -Filter *.ps1 -Recurse | Sort-Object FullName | ForEach-Object {
              $tokens = $null
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                  $_.FullName,
                  [ref]$tokens,
                  [ref]$errors
              ) | Out-Null
              if ($errors.Count -gt 0) {
                  $failed = $true
                  foreach ($parseError in $errors) {
                      Write-Host "::error file=$($_.FullName)::PowerShell parse error: $($parseError.Message)"
                  }
              }
          }
          if ($failed) {
              throw "One or more PowerShell operator scripts failed Windows PowerShell parsing."
          }

      - name: Validate critical PowerShell parameter contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          function Assert-Parameter {
              param(
                  [Parameter(Mandatory = $true)][string]$Script,
                  [Parameter(Mandatory = $true)][string]$Name,
                  [bool]$Mandatory = $false
              )
              $command = Get-Command (Resolve-Path -LiteralPath $Script)
              if (-not $command.Parameters.ContainsKey($Name)) {
                  throw "$Script is missing required parameter contract: $Name"
              }
              if ($Mandatory) {
                  $parameterAttributes = @(
                      $command.Parameters[$Name].Attributes |
                          Where-Object { $_ -is [System.Management.Automation.ParameterAttribute] }
                  )
                  if (-not ($parameterAttributes | Where-Object { $_.Mandatory })) {
                      throw "$Script parameter $Name must remain Mandatory."
                  }
              }
          }

          Assert-Parameter .\scripts\replay-us-deterministic.ps1 ExpectedHistoryParts $true
          Assert-Parameter .\scripts\replay-us-deterministic.ps1 Apply
          Assert-Parameter .\scripts\replay-us-deterministic.ps1 All
          Assert-Parameter .\scripts\replay-us-assignment-deterministic.ps1 ExpectedApplicationHistoryParts $true
          Assert-Parameter .\scripts\replay-us-ttab-deterministic.ps1 ExpectedApplicationHistoryParts $true
          Assert-Parameter .\scripts\assert-domain-apply-gate.ps1 TargetDomain $true
          Assert-Parameter .\scripts\assert-storage-headroom.ps1 MinimumHostFreeGiB
          Assert-Parameter .\scripts\assert-storage-headroom.ps1 MinimumClickHouseFreeGiB
          Assert-Parameter .\scripts\run-four-domain-final-acceptance.ps1 ExpectedApplicationHistoryParts $true
          Assert-Parameter .\scripts\run-four-domain-final-acceptance.ps1 ExpectedApplicationDailyThrough $true

      - name: Validate replay telemetry host snapshot on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          . .\scripts\replay-telemetry.ps1

          function Get-DataEngineReplayTelemetryRuntimeSnapshot {
              param([string]$RepoRoot, [string]$Jurisdiction)
              return [pscustomobject]@{
                  packages = [pscustomobject]@{ status_counts = [pscustomobject]@{} }
                  clickhouse = [pscustomobject]@{
                      active_bytes = 0
                      active_rows = 0
                      active_stage_bytes = 0
                  }
              }
          }

          $context = Start-DataEngineReplayTelemetry `
              -Domain "CN" `
              -Jurisdiction "CN" `
              -CommandName "ci-replay-telemetry"
          if (-not $context.start.host) {
              throw "Replay telemetry did not capture a host snapshot."
          }
          if ([int64]$context.start.host.total_space -le 0) {
              throw "Replay telemetry host total_space must be positive."
          }
          Remove-Item -LiteralPath $context.start_report -Force -ErrorAction SilentlyContinue

  runtime-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare CI Compose environment
        run: |
          cp .env.example .env
          sed -i 's|^RAW_DATA_PATH=.*|RAW_DATA_PATH=./raw_data|' .env
          mkdir -p raw_data

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build API/worker runtime image
        run: docker build --file docker/api.Dockerfile --tag markorbit-data-engine:ci .

      - name: Verify M1.6 runtime marker and API import
        run: |
          docker run --rm --entrypoint python markorbit-data-engine:ci -c "from app.main import ENGINE_VERSION; assert ENGINE_VERSION == 'M1.6', ENGINE_VERSION; print(ENGINE_VERSION)"

  us-runtime-fixture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare CI Compose environment
        run: |
          cp .env.example .env
          sed -i 's|^RAW_DATA_PATH=.*|RAW_DATA_PATH=./raw_data|' .env
          mkdir -p raw_data

      - name: Start PostgreSQL and ClickHouse
        run: docker compose up -d --wait postgres clickhouse

      - name: Run CN M1.6 bounded goods publisher fixture
        run: docker compose run --rm --no-deps worker python -m app.cn.validate_bounded_goods_fixture

      - name: Run CN M1.6 bounded party publisher fixture
        run: docker compose run --rm --no-deps worker python -m app.cn.validate_bounded_party_fixture

      - name: Run CN M1.6 bounded priority/Madrid snapshot fixture
        run: docker compose run --rm --no-deps worker python -m app.cn.validate_bounded_aux_snapshot_fixture

      - name: Run CN M1.6 resumable final snapshot fixture
        run: docker compose run --rm --no-deps worker python -m app.cn.validate_final_publish_subtask_fixture

      - name: Run Storage V2 deep audit against ClickHouse schema
        run: docker compose run --rm --no-deps worker python -m app.storage_audit --deep --compact

      - name: Run reversible Storage V2 CN goods compaction fixture
        run: docker compose run --rm --no-deps worker python -m app.cn.validate_storage_v2_goods_compaction_fixture

      - name: Run US M1.1 real-TDXF regression fixture
        run: docker compose run --rm --no-deps worker python -m app.us.validate_fixture

      - name: Run US M1.2 child snapshot fixture
        run: docker compose run --rm --no-deps worker python -m app.us.validate_snapshot_fixture

      - name: Run US M1.3 official fact families fixture
        run: docker compose run --rm --no-deps worker python -m app.us.validate_official_fact_fixture

      - name: Run US M1.3 real-data acceptance audit fixture
        run: docker compose run --rm --no-deps worker python -m app.us.validate_acceptance_fixture

      - name: Run deterministic US history-to-daily replay executor fixture
        run: docker compose run --rm --no-deps worker python -m app.us.validate_replay_executor_fixture

      - name: Run guarded US clean-rebuild reset and replay fixture
        run: docker compose run --rm --no-deps worker python -m app.us.validate_reset_rebuild_fixture

      - name: Run read-only US pipeline readiness state fixture
        run: docker compose run --rm --no-deps worker python -m app.us.validate_pipeline_readiness_fixture

      - name: Run US semantic reference and interpretation fixture
        run: docker compose run --rm --no-deps worker python -m app.us.validate_status_reference_fixture

      - name: Run US maintenance and reference-pack fixture
        run: docker compose run --rm --no-deps worker python -m app.us.validate_maintenance_fixture

      - name: Run US application deadline fixture
        run: docker compose run --rm --no-deps worker python -m app.us.validate_application_deadlines_fixture

      - name: Run reviewed US event-role deadline evidence fixture
        run: docker compose run --rm --no-deps worker python -m app.us.validate_deadline_evidence_fixture

      - name: Run US M1.4 durable change history fixture
        run: docker compose run --rm --no-deps worker python -m app.us.validate_change_history_fixture

      - name: Run deterministic US Assignment manifest replay fixture
        run: docker compose run --rm --no-deps worker python -m app.us_assignment.validate_corpus_replay_fixture

      - name: Run US Assignment M1.0 recorded-interest fixture
        run: docker compose run --rm --no-deps worker python -m app.us_assignment.validate_fixture

      - name: Run deterministic US TTAB bulk manifest replay fixture
        run: docker compose run --rm --no-deps worker python -m app.us_ttab.validate_corpus_replay_fixture

      - name: Run US TTAB M1.1 real-rawxml contract fixture
        run: docker compose run --rm --no-deps worker python -m app.us_ttab.validate_fixture

      - name: Run US Alert Engine M1.0 normalized-event fixture
        run: docker compose run --rm --no-deps worker python -m app.us.validate_alert_fixture

      - name: Tear down fixture databases
        if: always()
        run: docker compose down -v --remove-orphans
