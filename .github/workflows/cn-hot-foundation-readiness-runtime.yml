name: CN Hot Foundation Readiness Contract

on:
  pull_request:
    paths:
      - 'scripts/audit-cn-hot-foundation-readiness.ps1'
      - 'tests/test_cn_hot_foundation_readiness_contract.py'
      - '.github/workflows/cn-hot-foundation-readiness-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-powershell51:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Execute CN Hot read-only contract under Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -ne 5) {
            throw 'Contract must execute under Windows PowerShell 5.1.'
          }
          $output = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\audit-cn-hot-foundation-readiness.ps1 -ExpectedMainSha 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' -ContractOnly 2>&1
          $output | Write-Host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $text = $output -join [Environment]::NewLine
          if ($text -notmatch 'CN_HOT_FOUNDATION_READINESS_CONTRACT_PASS') {
            throw 'CN Hot readiness contract marker missing.'
          }
