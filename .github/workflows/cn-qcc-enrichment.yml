name: CN QCC Enrichment

on:
  pull_request:
  push:
    branches: [main]

jobs:
  postgres-fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare CI Compose environment
        run: |
          cp .env.example .env
          sed -i 's|^RAW_DATA_PATH=.*|RAW_DATA_PATH=./raw_data|' .env
          mkdir -p raw_data
      - name: Start PostgreSQL
        run: docker compose up -d --wait postgres
      - name: Run QCC planning/export/import fixture
        run: docker compose run --rm --no-deps worker python -m app.cn_qcc.validate_fixture
      - name: Run QCC periodic operator fixture
        run: docker compose run --rm --no-deps worker python -m app.cn_qcc.validate_operator_fixture
      - name: Run QCC production preflight fixture
        run: docker compose run --rm --no-deps worker python -m app.cn_qcc.validate_preflight_fixture
      - name: Tear down fixture database
        if: always()
        run: docker compose down -v --remove-orphans
