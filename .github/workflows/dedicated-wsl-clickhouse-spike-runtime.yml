name: Dedicated WSL ClickHouse Spike Runtime

on:
  pull_request:
    paths:
      - 'scripts/run-dedicated-wsl-clickhouse-spike.ps1'
      - 'tests/test_dedicated_wsl_clickhouse_spike_contract.py'
      - '.github/workflows/dedicated-wsl-clickhouse-spike-runtime.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows-powershell51:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse and freeze resumable dedicated WSL ClickHouse spike under Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -ne 5) {
            throw 'This guard must execute under Windows PowerShell 5.1.'
          }
          $path = 'scripts/run-dedicated-wsl-clickhouse-spike.ps1'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $path),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            throw ($errors | ForEach-Object { $_.Message } | Out-String)
          }
          $text = Get-Content -LiteralPath $path -Raw

          $required = @(
            "[switch]`$Apply",
            "[switch]`$ResumeExisting",
            "[switch]`$CleanupMounts",
            "MarkOrbit-ClickHouse-Spike",
            "24.8.14.39",
            "clickhouse-common-static_`$`{ClickHouseVersion`}_amd64.deb",
            "`$packagePath = `"/tmp/`$packageName`"",
            "-o '`$packagePath'",
            "SPIKE_RUNTIME_PARTIAL_STATE_REQUIRES_RESUME",
            "RESUME_RUNTIME_IDENTITY_MISMATCH",
            "READY_FOR_DEDICATED_WSL_CLICKHOUSE_RESUME",
            "resume_existing_runtime",
            "--export",
            "--import",
            "--version','2",
            "hot_cn_spike.vhdx",
            "hot_us_spike.vhdx",
            "hot_global_spike.vhdx",
            "warm_spike.vhdx",
            "ENGINE=MergeTree",
            "max(level)",
            "uniqExact(disk_name)",
            "tmp_insert_*",
            "host.docker.internal",
            "clickhouse_connect.get_client",
            "if (`$dockerStableNative -and `$appStableHttp)",
            "DEDICATED_WSL_CLICKHOUSE_GO",
            "WSL_CLICKHOUSE_STORAGE_GO_CONNECTIVITY_BLOCKED",
            "WSL_CLICKHOUSE_SPIKE_BLOCKED",
            "runtime_distro_unregister_performed=False",
            "spike_vhdx_delete_performed=False",
            "production_clickhouse_restart_performed=False",
            "production_clickhouse_mutation_performed=False",
            "accepted_volume_mutation_performed=False",
            "corpus_replay_performed=False",
            "DEDICATED_WSL_CLICKHOUSE_SPIKE_DONE"
          )
          foreach ($marker in $required) {
            if (-not $text.Contains($marker)) {
              throw "Missing required marker: $marker"
            }
          }

          $forbidden = @(
            '--unregister',
            'Remove-Item',
            'mkfs.ext4',
            "tmp='/tmp/",
            "docker','prune",
            "docker','volume','rm"
          )
          foreach ($marker in $forbidden) {
            if ($text.Contains($marker)) {
              throw "Forbidden operator behavior found: $marker"
            }
          }

          Write-Host 'DEDICATED_WSL_CLICKHOUSE_SPIKE_PS51_CONTRACT_PASS'
