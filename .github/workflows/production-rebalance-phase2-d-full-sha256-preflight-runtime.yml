name: Production Rebalance Phase2D Full SHA256 Preflight Runtime

on:
  pull_request:
    paths:
      - 'scripts/preflight-production-rebalance-phase2-d-full-sha256.ps1'
      - 'tests/test_production_rebalance_phase2_d_full_sha256_preflight_contract.py'
      - '.github/workflows/production-rebalance-phase2-d-full-sha256-preflight-runtime.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  windows-powershell51:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse and exercise Phase2D read-only contract under Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -ne 5) {
            throw 'Phase2D full-SHA256 preflight contract must execute under Windows PowerShell 5.1.'
          }

          $path = Resolve-Path 'scripts\preflight-production-rebalance-phase2-d-full-sha256.ps1'
          $tokens = $null
          $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw 'PowerShell 5.1 parser errors detected in Phase2D full-SHA256 preflight.'
          }

          $command = Get-Command $path
          foreach ($parameter in @('ExpectedMainSha','AcceptedVolume','LegacyRawRoot','RawTargetRoot','LegacyEHotRoot','LegacyEHotLogsRoot','EvidenceRoot','ContractOnly')) {
            if (-not $command.Parameters.ContainsKey($parameter)) { throw "Missing Phase2D preflight parameter: $parameter" }
          }
          if ($command.Parameters.ContainsKey('Apply')) { throw 'Read-only Phase2D preflight must not expose -Apply.' }

          $text = Get-Content -LiteralPath $path -Raw -Encoding UTF8
          foreach ($required in @(
            'PRODUCTION_REBALANCE_PHASE1_E_REPARSE_SAFE_DELETE_APPLY_V1',
            'PRODUCTION_REBALANCE_PHASE1_E_REPARSE_SAFE_DELETE_GO',
            'PRODUCTION_REBALANCE_PHASE2_D_FULL_SHA256_PREFLIGHT_V1',
            'PRODUCTION_REBALANCE_PHASE2_D_FULL_SHA256_PREFLIGHT_READY',
            'PRODUCTION_REBALANCE_PHASE2_D_RESUMABLE_APPLY_DESIGN',
            'phase2_d_file_delete_authorized=$false',
            'recursive_legacy_raw_root_delete_authorized=$false',
            'visual_processed_delete_authorized=$false',
            'mutation_performed=False'
          )) {
            if (-not $text.Contains($required)) { throw "Missing Phase2D preflight marker: $required" }
          }

          foreach ($forbidden in @(
            'Remove-Item','Move-Item','Copy-Item','robocopy','rsync',
            'New-VHD','Resize-VHD','Mount-VHD','Dismount-VHD','Optimize-VHD','Format-Volume',
            'docker volume rm','docker system prune','docker compose down','docker compose restart',
            'wsl.exe --shutdown','wsl.exe --unmount','ALTER TABLE','OPTIMIZE TABLE','2023_5.zip'
          )) {
            if ($text.Contains($forbidden)) { throw "Forbidden Phase2D preflight behavior found: $forbidden" }
          }

          powershell.exe -NoProfile -ExecutionPolicy Bypass -File $path `
            -ExpectedMainSha '0000000000000000000000000000000000000000' `
            -ContractOnly
          if ($LASTEXITCODE -ne 0) { throw "Phase2D ContractOnly exited $LASTEXITCODE." }

          Write-Host 'PRODUCTION_REBALANCE_PHASE2_D_FULL_SHA256_PREFLIGHT_PS51_CONTRACT_PASS'
