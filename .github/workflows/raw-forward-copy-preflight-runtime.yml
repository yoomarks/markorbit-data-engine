name: Raw Forward Copy Preflight Runtime

on:
  pull_request:
    paths:
      - 'scripts/preflight-raw-forward-copy-to-f.ps1'
      - 'tests/test_raw_forward_copy_preflight_contract.py'
      - '.github/workflows/raw-forward-copy-preflight-runtime.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows-powershell51:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse and freeze Raw forward-copy preflight under Windows PowerShell 5.1
        shell: powershell
        run: |
          $scriptPath = Join-Path $PWD 'scripts\preflight-raw-forward-copy-to-f.ps1'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($scriptPath, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw 'PowerShell parser errors detected.'
          }

          $text = Get-Content -LiteralPath $scriptPath -Raw -Encoding UTF8
          $required = @(
            'RAW_FORWARD_COPY_PREFLIGHT_V1',
            'RAW_FORWARD_COPY_PREFLIGHT_READY',
            'RAW_FORWARD_COPY_PREFLIGHT_BLOCKED',
            'RAW_FORWARD_COPY_PREFLIGHT_DONE',
            "F:\MarkOrbitData\raw",
            'FORWARD_COPY_PRESERVE_D_SOURCE',
            'BYTE_PARITY',
            'RUNTIME_BIND_CUTOVER',
            'copy_authorized=$false',
            'env_change_authorized=$false',
            'raw_delete_authorized=$false'
          )
          foreach ($marker in $required) {
            if (-not $text.Contains($marker)) { throw "Missing safety marker: $marker" }
          }

          $forbidden = @(
            'Copy-Item',
            'Move-Item',
            'Remove-Item',
            'robocopy ',
            'rsync ',
            'Mount-VHD',
            'Dismount-VHD',
            'Resize-VHD',
            'New-VHD',
            'mkfs.ext4',
            'Format-Volume',
            '--shutdown',
            '--unregister',
            "docker','restart",
            "docker','prune",
            "docker','volume','rm",
            'ALTER TABLE',
            'OPTIMIZE TABLE',
            '2023_5.zip'
          )
          foreach ($marker in $forbidden) {
            if ($text.Contains($marker)) { throw "Forbidden mutation/replay marker present: $marker" }
          }

          Write-Host 'RAW_FORWARD_COPY_PREFLIGHT_PS51_CONTRACT_PASS'
