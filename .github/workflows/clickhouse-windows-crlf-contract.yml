name: ClickHouse Windows CRLF Contract

on:
  pull_request:
    paths:
      - "scripts/check-clickhouse-hot-cutover-readiness.ps1"
      - "scripts/migrate-clickhouse-volume-to-hot.ps1"
      - ".github/workflows/clickhouse-windows-crlf-contract.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/check-clickhouse-hot-cutover-readiness.ps1"
      - "scripts/migrate-clickhouse-volume-to-hot.ps1"
      - ".github/workflows/clickhouse-windows-crlf-contract.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  windows-crlf-shell-transport:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify readiness and migration Base64 encoders normalize CRLF
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $scripts = @(
              "scripts/check-clickhouse-hot-cutover-readiness.ps1",
              "scripts/migrate-clickhouse-volume-to-hot.ps1"
          )

          foreach ($scriptPath in $scripts) {
              $source = Get-Content -LiteralPath $scriptPath -Raw
              $tokens = $null
              $errors = $null
              $ast = [System.Management.Automation.Language.Parser]::ParseInput($source, [ref]$tokens, [ref]$errors)
              if ($errors.Count -ne 0) {
                  throw "PowerShell parse errors in $scriptPath`: $($errors -join '; ')"
              }

              $functionAst = $ast.Find({
                  param($node)
                  $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and
                      $node.Name -eq "ConvertTo-Base64Utf8"
              }, $true)
              if ($null -eq $functionAst) {
                  throw "ConvertTo-Base64Utf8 not found in $scriptPath."
              }

              Remove-Item -Path Function:\ConvertTo-Base64Utf8 -ErrorAction SilentlyContinue
              Invoke-Expression $functionAst.Extent.Text
              $inputText = "set -eu`r`necho transport-ok`r"
              $payload = ConvertTo-Base64Utf8 -Text $inputText
              $decoded = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($payload))

              if ($decoded.Contains("`r")) {
                  throw "Decoded shell script from $scriptPath still contains carriage returns."
              }
              if ($decoded -ne "set -eu`necho transport-ok`n") {
                  throw "Unexpected normalized shell script from $scriptPath`: $decoded"
              }
          }

      - name: Verify Docker wrapper uses exit code instead of benign stderr
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $scripts = @(
              "scripts/check-clickhouse-hot-cutover-readiness.ps1",
              "scripts/migrate-clickhouse-volume-to-hot.ps1"
          )
          $fakeBin = Join-Path $env:RUNNER_TEMP "markorbit-fake-docker"
          New-Item -ItemType Directory -Path $fakeBin -Force | Out-Null
          $fakeDocker = Join-Path $fakeBin "docker.cmd"
          @'
          @echo off
          if "%1"=="success" (
            echo progress-ok 1>&2
            echo stdout-ok
            exit /b 0
          )
          echo progress-fail 1>&2
          echo stdout-fail
          exit /b 23
          '@ | Set-Content -LiteralPath $fakeDocker -Encoding ASCII
          $originalPath = $env:PATH
          $env:PATH = "$fakeBin;$originalPath"

          try {
              foreach ($scriptPath in $scripts) {
                  $source = Get-Content -LiteralPath $scriptPath -Raw
                  $tokens = $null
                  $errors = $null
                  $ast = [System.Management.Automation.Language.Parser]::ParseInput($source, [ref]$tokens, [ref]$errors)
                  if ($errors.Count -ne 0) {
                      throw "PowerShell parse errors in $scriptPath`: $($errors -join '; ')"
                  }

                  $functionAst = $ast.Find({
                      param($node)
                      $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and
                          $node.Name -eq "Invoke-DockerText"
                  }, $true)
                  if ($null -eq $functionAst) {
                      throw "Invoke-DockerText not found in $scriptPath."
                  }

                  Remove-Item -Path Function:\Invoke-DockerText -ErrorAction SilentlyContinue
                  Invoke-Expression $functionAst.Extent.Text

                  $successOutput = @(Invoke-DockerText -Arguments @("success"))
                  $successText = $successOutput -join "`n"
                  if ($successText -notmatch "stdout-ok" -or $successText -notmatch "progress-ok") {
                      throw "Exit-0 native stderr/stdout was not captured for $scriptPath`: $successText"
                  }

                  $failed = $false
                  try {
                      Invoke-DockerText -Arguments @("fail") | Out-Null
                  }
                  catch {
                      $failed = $true
                      $message = $_.Exception.Message
                      if ($message -notmatch "exit code 23" -or
                          $message -notmatch "progress-fail" -or
                          $message -notmatch "stdout-fail") {
                          throw "Nonzero native diagnostics were incomplete for $scriptPath`: $message"
                      }
                  }
                  if (-not $failed) {
                      throw "Invoke-DockerText did not fail on exit code 23 for $scriptPath."
                  }
              }
          }
          finally {
              $env:PATH = $originalPath
              # The failure path above is intentionally caught and asserted. The
              # GitHub PowerShell runner appends an implicit native-exit check, so
              # clear the expected test exit code after all assertions pass.
              $global:LASTEXITCODE = 0
          }
