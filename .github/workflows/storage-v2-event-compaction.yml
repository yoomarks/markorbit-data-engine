name: Storage V2 Event Compaction

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  clickhouse-event-compaction-fixture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare CI Compose environment
        run: |
          cp .env.example .env
          sed -i 's|^RAW_DATA_PATH=.*|RAW_DATA_PATH=./raw_data|' .env
          mkdir -p raw_data

      - name: Start PostgreSQL and ClickHouse
        run: docker compose up -d --wait postgres clickhouse

      - name: Run guarded Storage V2 CN observed-event fixture
        run: docker compose run --rm --no-deps worker python -m app.cn.validate_storage_v2_event_compaction_fixture

      - name: Tear down fixture databases
        if: always()
        run: docker compose down -v --remove-orphans
